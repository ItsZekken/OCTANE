  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 276 120 L 354 74 C 368 66, 390 65, 416 65 L 550 66 L 592 92 L 610 122 L 452 122 Z"/>
  <line x1="442" y1="65" x2="438" y2="122" stroke="#09090B" stroke-width="12"/>

