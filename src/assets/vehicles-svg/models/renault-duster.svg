<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="250" x2="670" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="220" cy="199" r="54" fill="#09090B"/>
  <circle cx="580" cy="199" r="54" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 112 202 C 106 178, 116 154, 142 144 C 174 136, 222 132, 258 128 L 334 76 C 352 68, 376 66, 408 66 L 594 68 L 632 72 L 620 86 L 652 150 C 658 170, 658 194, 650 202 L 632 204 A 52 52 0 0 0 528 204 L 272 204 A 52 52 0 0 0 168 204 Z"/>
  <!-- Rugged Roof Rails -->
  <line x1="360" y1="56" x2="580" y2="56" stroke="#09090B" stroke-width="6" stroke-linecap="round"/>
  <line x1="380" y1="56" x2="380" y2="66" stroke="#09090B" stroke-width="4"/>
  <line x1="560" y1="56" x2="560" y2="68" stroke="#09090B" stroke-width="4"/>
  <!-- Bold Industrial Wheel Arch Cladding -->
  <path d="M 166 204 A 54 54 0 0 1 274 204" stroke="#18181B" stroke-width="9" fill="none"/>
  <path d="M 526 204 A 54 54 0 0 1 634 204" stroke="#18181B" stroke-width="9" fill="none"/>
  <!-- Roof Highlight Line -->
  <path d="M 144 144 C 176 136, 224 132, 260 128 L 336 78 L 592 70" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 276 128 L 344 80 C 358 72, 380 71, 406 71 L 574 72 L 596 112 L 460 126 Z"/>
  <line x1="442" y1="71" x2="438" y2="126" stroke="#09090B" stroke-width="12"/>

  <!-- Lighting: Front Headlight & Rear Stop -->
  <path d="M 122 158 L 170 146 L 164 166 Z" fill="#F8FAFC" stroke="#09090B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 632 110 L 652 150 L 654 174 L 634 170 Z" fill="#F43F5E" stroke="#09090B" stroke-width="5" stroke-linejoin="round"/>

  <!-- Front Wheel (Center: 220, 199) -->
  <g transform="translate(220, 199)">
    <g class="vehicle-wheel vehicle-wheel-front" style="transform-box: fill-box; transform-origin: center;">
      <circle r="49" fill="#141418" stroke="#09090B" stroke-width="6"/>
      <circle r="30" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#D4D4D8" stroke-width="5"/>
      <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
    </g>
  </g>

  <!-- Rear Wheel (Center: 580, 199) -->
  <g transform="translate(580, 199)">
    <g class="vehicle-wheel vehicle-wheel-rear" style="transform-box: fill-box; transform-origin: center;">
      <circle r="49" fill="#141418" stroke="#09090B" stroke-width="6"/>
      <circle r="30" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#D4D4D8" stroke-width="5"/>
      <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
    </g>
  </g>
</svg>
