<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="250" x2="630" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="255" cy="204" r="50" fill="#09090B"/>
  <circle cx="555" cy="204" r="50" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 168 212 C 166 182, 175 156, 192 142 C 215 128, 252 124, 280 118 L 362 64 C 376 56, 394 56, 418 56 L 574 58 L 610 60 L 598 74 L 626 150 C 632 170, 630 196, 626 214 L 602 218 A 48 48 0 0 0 508 218 L 302 218 A 48 48 0 0 0 208 218 Z"/>
  <!-- Roof Highlight Line -->
  <path d="M 195 142 C 220 128, 256 122, 282 118 L 364 66 L 572 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 296 118 L 368 70 C 378 64, 392 64, 412 64 L 544 66 L 588 94 L 460 116 Z"/>
  <line x1="442" y1="65" x2="438" y2="118" stroke="#09090B" stroke-width="12"/>

  <!-- Lighting: Front Headlight & Rear Stop -->
  <path d="M 178 158 L 230 138 L 222 160 Z" fill="#F8FAFC" stroke="#09090B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 606 100 L 626 148 L 628 174 L 608 168 Z" fill="#F43F5E" stroke="#09090B" stroke-width="5" stroke-linejoin="round"/>

  <!-- Front Wheel (Center: 255, 204) -->
  <g transform="translate(255, 204)">
    <circle r="44" fill="#141418" stroke="#09090B" stroke-width="6"/>
    <circle r="27" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>

  <!-- Rear Wheel (Center: 555, 204) -->
  <g transform="translate(555, 204)">
    <circle r="44" fill="#141418" stroke="#09090B" stroke-width="6"/>
    <circle r="27" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>
</svg>
