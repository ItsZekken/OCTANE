  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 276 120 L 356 74 C 370 66, 392 65, 418 65 L 552 66 L 594 92 L 610 122 L 452 122 Z"/>
  <line x1="444" y1="65" x2="440" y2="122" stroke="#09090B" stroke-width="12"/>

