<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="250" x2="670" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="215" cy="202" r="52" fill="#09090B"/>
  <circle cx="585" cy="202" r="52" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 110 210 C 108 180, 118 156, 146 142 C 174 130, 222 124, 260 120 L 348 68 C 366 60, 390 58, 420 58 L 566 60 L 618 84 L 636 124 L 702 126 C 710 134, 710 162, 704 182 C 698 200, 686 208, 668 212 L 633 216 A 48 48 0 0 0 537 216 L 263 216 A 48 48 0 0 0 167 216 Z"/>
