  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 104 208 C 102 178, 114 150, 142 136 C 172 122, 224 116, 268 112 L 358 64 C 378 56, 404 54, 436 54 L 562 56 C 596 58, 626 72, 646 96 L 664 128 L 706 130 C 712 138, 712 164, 706 182 C 700 200, 688 206, 672 210 L 633 216 A 48 48 0 0 0 537 216 L 263 216 A 48 48 0 0 0 167 216 Z"/>
