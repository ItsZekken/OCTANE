<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="125" y1="250" x2="665" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="220" cy="199" r="54" fill="#09090B"/>
  <circle cx="580" cy="199" r="54" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 118 202 C 114 178, 124 154, 150 142 C 180 132, 226 126, 264 122 L 340 72 C 356 64, 380 62, 410 62 L 582 64 L 616 68 L 606 82 L 640 150 C 646 170, 646 194, 640 202 L 632 204 A 52 52 0 0 0 528 204 L 272 204 A 52 52 0 0 0 168 204 Z"/>
  <!-- Compact Roof Rails & Cladding -->
  <line x1="365" y1="54" x2="575" y2="54" stroke="#09090B" stroke-width="5" stroke-linecap="round"/>
  <path d="M 166 204 A 54 54 0 0 1 274 204" stroke="#18181B" stroke-width="9" fill="none"/>
  <path d="M 526 204 A 54 54 0 0 1 634 204" stroke="#18181B" stroke-width="9" fill="none"/>
  <!-- Roof Highlight Line -->
  <path d="M 152 142 C 182 132, 228 126, 266 122 L 342 74 L 580 68" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 280 122 L 348 78 C 362 70, 384 69, 408 69 L 564 70 L 586 112 L 460 122 Z"/>
  <line x1="442" y1="69" x2="438" y2="122" stroke="#09090B" stroke-width="12"/>

  <!-- Lighting: Front Headlight & Rear Stop -->
  <path d="M 130 156 L 176 142 L 170 162 Z" fill="#F8FAFC" stroke="#09090B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 620 110 L 640 148 L 642 172 L 622 168 Z" fill="#F43F5E" stroke="#09090B" stroke-width="5" stroke-linejoin="round"/>

  <!-- Front Wheel (Center: 220, 199) -->
  <g transform="translate(220, 199)">
    <circle r="49" fill="#141418" stroke="#09090B" stroke-width="6"/>
    <circle r="30" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>

  <!-- Rear Wheel (Center: 580, 199) -->
  <g transform="translate(580, 199)">
    <circle r="49" fill="#141418" stroke="#09090B" stroke-width="6"/>
    <circle r="30" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>
</svg>
