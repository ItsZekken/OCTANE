<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="250" x2="670" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="215" cy="202" r="52" fill="#09090B"/>
  <circle cx="585" cy="202" r="52" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 106 208 C 104 178, 114 152, 140 138 C 170 124, 220 118, 262 114 L 350 66 C 368 58, 394 56, 424 56 L 562 58 L 618 84 L 642 124 L 704 126 C 710 134, 710 162, 704 182 C 698 200, 686 206, 670 210 L 633 216 A 48 48 0 0 0 537 216 L 263 216 A 48 48 0 0 0 167 216 Z"/>
  <!-- Roof Highlight Line -->
  <path d="M 142 138 C 172 124, 222 118, 264 114 L 352 68 L 560 60 L 616 86 L 640 126 L 702 128" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 280 114 L 358 72 C 372 64, 396 63, 422 63 L 550 64 L 594 90 L 616 120 L 458 120 Z"/>
  <line x1="448" y1="63" x2="442" y2="120" stroke="#09090B" stroke-width="12"/>

  <!-- Lighting: Front Headlight & Rear Stop -->
  <path d="M 118 152 L 168 136 L 162 156 Z" fill="#F8FAFC" stroke="#09090B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 686 132 L 706 134 L 704 162 L 684 158 Z" fill="#F43F5E" stroke="#09090B" stroke-width="5" stroke-linejoin="round"/>

  <!-- Front Wheel (Center: 215, 202) -->
  <g transform="translate(215, 202)">
    <g class="vehicle-wheel vehicle-wheel-front" style="transform-box: fill-box; transform-origin: center;">
      <circle r="46" fill="#141418" stroke="#09090B" stroke-width="6"/>
      <circle r="28" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="0" y1="-25" x2="0" y2="25" stroke="#D4D4D8" stroke-width="5"/>
      <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
    </g>
  </g>

  <!-- Rear Wheel (Center: 585, 202) -->
  <g transform="translate(585, 202)">
    <g class="vehicle-wheel vehicle-wheel-rear" style="transform-box: fill-box; transform-origin: center;">
      <circle r="46" fill="#141418" stroke="#09090B" stroke-width="6"/>
      <circle r="28" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="0" y1="-25" x2="0" y2="25" stroke="#D4D4D8" stroke-width="5"/>
      <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
    </g>
  </g>
</svg>
