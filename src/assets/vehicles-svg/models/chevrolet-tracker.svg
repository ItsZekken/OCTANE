<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="250" x2="670" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="220" cy="199" r="54" fill="#09090B"/>
  <circle cx="580" cy="199" r="54" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 114 202 C 110 178, 120 152, 146 140 C 176 130, 224 124, 262 120 L 344 70 C 362 62, 386 60, 416 60 L 580 62 L 618 66 L 606 80 L 644 148 C 650 168, 650 194, 644 202 L 632 204 A 52 52 0 0 0 528 204 L 272 204 A 52 52 0 0 0 168 204 Z"/>
  <!-- Roof Rails & Cladding -->
  <line x1="370" y1="52" x2="570" y2="52" stroke="#09090B" stroke-width="5" stroke-linecap="round"/>
  <path d="M 166 204 A 54 54 0 0 1 274 204" stroke="#18181B" stroke-width="9" fill="none"/>
  <path d="M 526 204 A 54 54 0 0 1 634 204" stroke="#18181B" stroke-width="9" fill="none"/>
  <!-- Roof Highlight Line -->
  <path d="M 148 140 C 178 130, 226 124, 264 120 L 346 72 L 578 66" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 280 120 L 352 76 C 368 68, 390 67, 414 67 L 562 68 L 586 110 L 460 120 Z"/>
  <line x1="446" y1="67" x2="442" y2="120" stroke="#09090B" stroke-width="12"/>

  <!-- Lighting: Front Headlight & Rear Stop -->
  <path d="M 126 156 L 174 142 L 168 162 Z" fill="#F8FAFC" stroke="#09090B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 624 108 L 644 146 L 646 170 L 626 166 Z" fill="#F43F5E" stroke="#09090B" stroke-width="5" stroke-linejoin="round"/>

  <!-- Front Wheel (Center: 220, 199) -->
  <g transform="translate(220, 199)">
    <circle r="49" fill="#141418" stroke="#09090B" stroke-width="6"/>
    <circle r="30" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>

  <!-- Rear Wheel (Center: 580, 199) -->
  <g transform="translate(580, 199)">
    <circle r="49" fill="#141418" stroke="#09090B" stroke-width="6"/>
    <circle r="30" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>
</svg>
