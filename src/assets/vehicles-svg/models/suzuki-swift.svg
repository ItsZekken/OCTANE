<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="155" y1="250" x2="645" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="235" cy="203" r="51" fill="#09090B"/>
  <circle cx="575" cy="203" r="51" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 152 212 C 150 182, 160 156, 184 142 C 210 130, 254 126, 286 122 L 342 74 C 354 66, 372 64, 400 64 L 588 64 L 618 68 L 606 82 L 634 154 C 640 174, 638 196, 634 212 L 623 216 A 48 48 0 0 0 527 216 L 283 216 A 48 48 0 0 0 187 216 Z"/>
  <!-- Roof Highlight Line -->
  <path d="M 186 142 C 212 130, 256 126, 288 122 L 344 76 L 586 68" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 298 122 L 348 80 C 358 72, 374 71, 398 71 L 568 71 L 586 108 L 464 122 Z"/>
  <line x1="444" y1="71" x2="440" y2="122" stroke="#09090B" stroke-width="12"/>

