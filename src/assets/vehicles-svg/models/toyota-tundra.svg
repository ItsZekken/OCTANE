<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="110" y1="250" x2="700" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="220" cy="194" r="58" fill="#09090B"/>
  <circle cx="600" cy="194" r="58" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 102 192 C 98 162, 106 132, 130 118 C 164 108, 220 104, 262 100 L 340 54 C 358 46, 384 44, 416 44 L 530 46 C 542 52, 546 62, 546 76 L 546 126 L 690 126 L 710 132 C 716 140, 714 172, 706 190 L 656 194 A 56 56 0 0 0 544 194 L 276 194 A 56 56 0 0 0 164 194 Z"/>
  <!-- Massive Full-Size Bed Separation Seam -->
  <line x1="538" y1="52" x2="538" y2="194" stroke="#09090B" stroke-width="6"/>
  <!-- Bed Top Rail -->
  <line x1="546" y1="124" x2="696" y2="124" stroke="#09090B" stroke-width="6" stroke-linecap="round"/>
  <!-- Heavy Duty Side Step -->
  <line x1="284" y1="202" x2="534" y2="202" stroke="#09090B" stroke-width="7" stroke-linecap="round"/>
  <!-- Roof Highlight Line -->
  <path d="M 132 118 C 166 108, 222 104, 264 100 L 342 56 L 528 50" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 280 100 L 348 60 C 362 52, 386 51, 414 51 L 516 52 L 528 100 L 448 100 Z"/>
  <line x1="436" y1="51" x2="432" y2="100" stroke="#09090B" stroke-width="12"/>

  <!-- Lighting: Front Headlight & Rear Stop -->
  <path d="M 114 134 L 166 118 L 160 138 Z" fill="#F8FAFC" stroke="#09090B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 690 130 L 710 132 L 708 166 L 688 162 Z" fill="#F43F5E" stroke="#09090B" stroke-width="5" stroke-linejoin="round"/>

  <!-- Front Wheel (Center: 220, 194) -->
  <g transform="translate(220, 194)">
    <circle r="52" fill="#141418" stroke="#09090B" stroke-width="6" stroke-dasharray="14 6"/>
    <circle r="31" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-27" y1="0" x2="27" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-27" x2="0" y2="27" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>

  <!-- Rear Wheel (Center: 600, 194) -->
  <g transform="translate(600, 194)">
    <circle r="52" fill="#141418" stroke="#09090B" stroke-width="6" stroke-dasharray="14 6"/>
    <circle r="31" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-27" y1="0" x2="27" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-27" x2="0" y2="27" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>
</svg>
