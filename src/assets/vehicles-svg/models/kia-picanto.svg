<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="175" y1="250" x2="625" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="255" cy="204" r="50" fill="#09090B"/>
  <circle cx="555" cy="204" r="50" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 172 212 C 170 185, 178 160, 196 148 C 218 135, 248 128, 274 122 L 352 68 C 366 60, 382 58, 405 58 L 582 60 L 606 62 L 596 76 L 622 154 C 627 172, 628 194, 624 214 L 602 218 A 48 48 0 0 0 508 218 L 302 218 A 48 48 0 0 0 208 218 Z"/>
  <!-- Roof Highlight Line -->
  <path d="M 200 148 C 222 136, 250 130, 274 124 L 354 70 L 580 64" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 290 122 L 358 74 C 368 68, 382 67, 402 67 L 556 69 L 572 108 L 455 122 Z"/>
  <line x1="436" y1="68" x2="432" y2="122" stroke="#09090B" stroke-width="12"/>

  <!-- Lighting: Front Headlight & Rear Stop -->
  <path d="M 182 162 L 222 148 L 214 166 Z" fill="#F8FAFC" stroke="#09090B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 604 102 L 622 154 L 624 176 L 604 172 Z" fill="#F43F5E" stroke="#09090B" stroke-width="5" stroke-linejoin="round"/>

  <!-- Front Wheel (Center: 255, 204) -->
  <g transform="translate(255, 204)">
    <g class="vehicle-wheel vehicle-wheel-front" style="transform-box: fill-box; transform-origin: center;">
      <circle r="44" fill="#141418" stroke="#09090B" stroke-width="6"/>
      <circle r="27" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#D4D4D8" stroke-width="5"/>
      <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
    </g>
  </g>

  <!-- Rear Wheel (Center: 555, 204) -->
  <g transform="translate(555, 204)">
    <g class="vehicle-wheel vehicle-wheel-rear" style="transform-box: fill-box; transform-origin: center;">
      <circle r="44" fill="#141418" stroke="#09090B" stroke-width="6"/>
      <circle r="27" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#D4D4D8" stroke-width="5"/>
      <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
    </g>
  </g>
</svg>
