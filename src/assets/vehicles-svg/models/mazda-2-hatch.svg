<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="250" x2="650" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="235" cy="203" r="51" fill="#09090B"/>
  <circle cx="575" cy="203" r="51" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 142 210 C 140 180, 150 152, 174 138 C 202 124, 250 118, 290 114 L 372 68 C 390 60, 412 58, 442 58 L 594 60 L 626 64 L 614 78 L 642 152 C 648 172, 648 196, 642 212 L 623 216 A 48 48 0 0 0 527 216 L 283 216 A 48 48 0 0 0 187 216 Z"/>
  <!-- Roof Highlight Line -->
  <path d="M 176 138 C 204 124, 252 118, 292 114 L 374 70 L 592 64" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 306 114 L 378 74 C 394 66, 414 65, 440 65 L 570 67 L 592 106 L 468 116 Z"/>
  <line x1="454" y1="66" x2="448" y2="116" stroke="#09090B" stroke-width="12"/>

  <!-- Lighting: Front Headlight & Rear Stop -->
  <path d="M 152 154 L 202 138 L 194 158 Z" fill="#F8FAFC" stroke="#09090B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 622 108 L 642 150 L 644 172 L 624 168 Z" fill="#F43F5E" stroke="#09090B" stroke-width="5" stroke-linejoin="round"/>

  <!-- Front Wheel (Center: 235, 203) -->
  <g transform="translate(235, 203)">
    <circle r="45" fill="#141418" stroke="#09090B" stroke-width="6"/>
    <circle r="28" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>

  <!-- Rear Wheel (Center: 575, 203) -->
  <g transform="translate(575, 203)">
    <circle r="45" fill="#141418" stroke="#09090B" stroke-width="6"/>
    <circle r="28" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>
</svg>
