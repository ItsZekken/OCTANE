<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="170" y1="250" x2="630" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="255" cy="204" r="50" fill="#09090B"/>
  <circle cx="555" cy="204" r="50" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 170 214 C 168 186, 172 162, 186 146 C 204 136, 238 132, 268 128 L 344 72 C 358 64, 378 62, 404 62 L 576 64 L 604 68 L 594 80 L 622 152 C 628 172, 628 196, 624 214 L 602 218 A 48 48 0 0 0 508 218 L 302 218 A 48 48 0 0 0 208 218 Z"/>
  <!-- Roof Highlight Line -->
  <path d="M 188 146 C 206 136, 240 132, 270 128 L 346 74 L 574 66" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 284 126 L 350 78 C 362 70, 380 69, 402 69 L 552 70 L 570 112 L 452 126 Z"/>
  <line x1="434" y1="70" x2="430" y2="126" stroke="#09090B" stroke-width="12"/>

  <!-- Lighting: Front Headlight & Rear Stop -->
  <path d="M 176 156 L 218 144 L 212 164 Z" fill="#F8FAFC" stroke="#09090B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 602 108 L 622 150 L 624 176 L 604 170 Z" fill="#F43F5E" stroke="#09090B" stroke-width="5" stroke-linejoin="round"/>

  <!-- Front Wheel (Center: 255, 204) -->
  <g transform="translate(255, 204)">
    <circle r="44" fill="#141418" stroke="#09090B" stroke-width="6"/>
    <circle r="27" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>

  <!-- Rear Wheel (Center: 555, 204) -->
  <g transform="translate(555, 204)">
    <circle r="44" fill="#141418" stroke="#09090B" stroke-width="6"/>
    <circle r="27" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#D4D4D8" stroke-width="5"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#D4D4D8" stroke-width="5"/>
    <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
  </g>
</svg>
