<svg viewBox="0 0 800 280" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Datum & Contact Shadow (Y=250) -->
  <line x1="80" y1="250" x2="720" y2="250" stroke="#27272A" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="250" x2="670" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

  <!-- Wheel Arch Cutout Shadows -->
  <circle cx="220" cy="199" r="54" fill="#09090B"/>
  <circle cx="580" cy="199" r="54" fill="#09090B"/>

  <!-- Body Silhouette -->
  <path fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 112 202 C 108 176, 118 150, 144 138 C 174 126, 226 120, 266 116 L 350 68 C 368 60, 392 58, 424 58 L 576 60 L 616 64 L 604 78 L 642 148 C 648 168, 648 194, 642 202 L 632 204 A 52 52 0 0 0 528 204 L 272 204 A 52 52 0 0 0 168 204 Z"/>
  <!-- Ultra-Thick Kodo Wheel Arch Cladding -->
  <path d="M 166 204 A 54 54 0 0 1 274 204" stroke="#18181B" stroke-width="12" fill="none"/>
  <path d="M 526 204 A 54 54 0 0 1 634 204" stroke="#18181B" stroke-width="12" fill="none"/>
  <!-- Roof Highlight Line -->
  <path d="M 146 138 C 176 126, 228 120, 268 116 L 352 70 L 574 64" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Greenhouse Glass & B-Pillar -->
  <path fill="#111116" stroke="#09090B" stroke-width="6" stroke-linejoin="round" d="M 284 116 L 358 74 C 374 66, 396 65, 422 65 L 558 66 L 582 108 L 458 118 Z"/>
  <line x1="446" y1="65" x2="440" y2="118" stroke="#09090B" stroke-width="12"/>

  <!-- Lighting: Front Headlight & Rear Stop -->
  <path d="M 124 154 L 176 138 L 168 158 Z" fill="#F8FAFC" stroke="#09090B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 622 106 L 642 146 L 644 170 L 624 166 Z" fill="#F43F5E" stroke="#09090B" stroke-width="5" stroke-linejoin="round"/>

  <!-- Front Wheel (Center: 220, 199) -->
  <g transform="translate(220, 199)">
    <g class="vehicle-wheel vehicle-wheel-front" style="transform-box: fill-box; transform-origin: center;">
      <circle r="49" fill="#141418" stroke="#09090B" stroke-width="6"/>
      <circle r="30" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#D4D4D8" stroke-width="5"/>
      <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
    </g>
  </g>

  <!-- Rear Wheel (Center: 580, 199) -->
  <g transform="translate(580, 199)">
    <g class="vehicle-wheel vehicle-wheel-rear" style="transform-box: fill-box; transform-origin: center;">
      <circle r="49" fill="#141418" stroke="#09090B" stroke-width="6"/>
      <circle r="30" fill="#09090B" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="-26" y1="0" x2="26" y2="0" stroke="#D4D4D8" stroke-width="5"/>
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#D4D4D8" stroke-width="5"/>
      <circle r="9" fill="var(--car-paint, #FF5500)" stroke="#09090B" stroke-width="4"/>
    </g>
  </g>
</svg>
