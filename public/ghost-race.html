      /* ── Theme Management ─────────────────────────────────────────── */
      function resolveInitialTheme() {
        try {
          const params = new URLSearchParams(window.location.search);
          const q = params.get('theme');
          if (q === 'light' || q === 'dark') return q;
        } catch (_) {}
        try {
          const ls = localStorage.getItem('octane_theme');
          if (ls === 'light' || ls === 'dark') return ls;
        } catch (_) {}
        return 'dark';
      }

      function applyTheme(theme) {
        currentTheme = theme === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        if (metaThemeColor) {
          metaThemeColor.setAttribute('content', THEME_PALETTES[currentTheme].bgVoid);
        }
      }

      /* ── Web Audio Synthesizer ────────────────────────────────────── */
      let audioCtx = null;
      function playTick(freq = 1100, dur = 0.012, vol = 0.018, type = 'triangle') {
        if (!audioEnabled) return;
        try {
          if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            audioCtx = new AC();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
          }
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + dur);
        } catch (_) {}
      }

      function playArrivalChime(isPb) {
        if (!audioEnabled) return;
        const now = performance.now();
        if (isPb) {
          playTick(1320, 0.04, 0.028, 'sine');
          setTimeout(() => playTick(1760, 0.06, 0.022, 'sine'), 48);
          lastTickSoundMs = now;
          return;
        }
        if (now - lastTickSoundMs < 110) return;
        lastTickSoundMs = now;
        playTick(1480, 0.01, 0.012, 'sine');
      }

      /* ── Basemap Tile Loader (Dual Theme, Zero API Key) ───────────── */
      const tileCache = new Map();

      function getTileUrl(theme, z, x, y) {
        const layer = theme === 'light' ? 'World_Light_Gray_Base' : 'World_Dark_Gray_Base';
        return `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${layer}/MapServer/tile/${z}/${y}/${x}`;
      }

      function getTile(theme, z, x, y) {
        const maxIndex = Math.pow(2, z);
        if (y < 0 || y >= maxIndex) return false;
        const wrappedX = ((x % maxIndex) + maxIndex) % maxIndex;
        const key = `${theme}:${z}/${y}/${wrappedX}`;
        if (tileCache.has(key)) return tileCache.get(key);

        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = getTileUrl(theme, z, wrappedX, y);
        tileCache.set(key, null);
        img.onload = () => { tileCache.set(key, img); };
        img.onerror = () => { tileCache.set(key, false); };
        return null;
      }

      /* ── Web Mercator Projection ──────────────────────────────────── */
      function projectMercator(lat, lng, zoom) {
        const clampedLat = Math.max(-85.05112878, Math.min(85.05112878, lat));
        const scale = 256 * Math.pow(2, zoom);
        const x = ((lng + 180) / 360) * scale;
        const sinLat = Math.sin((clampedLat * Math.PI) / 180);
        const y = (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * scale;
        return { x, y };
      }

      function unprojectMercator(px, py, zoom) {
        const scale = 256 * Math.pow(2, zoom);
        const lng = (px / scale) * 360 - 180;
        const n = Math.PI - (2 * Math.PI * py) / scale;
        const lat = (180 / Math.PI) * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
        return { lat, lng };
      }

      function latLngToScreen(lat, lng, width, height) {
        const baseZoom = Math.floor(curZoom);
        const subScale = Math.pow(2, curZoom - baseZoom);
        const centerWorld = projectMercator(curLat, curLng, baseZoom);
        const ptWorld = projectMercator(lat, lng, baseZoom);
        return {
          x: width * 0.5 + (ptWorld.x - centerWorld.x) * subScale,
          y: height * 0.5 + (ptWorld.y - centerWorld.y) * subScale
        };
      }

      function screenToLatLng(sx, sy) {
        const rect = canvas.getBoundingClientRect();
        const baseZoom = Math.floor(curZoom);
        const subScale = Math.pow(2, curZoom - baseZoom);
        const centerWorld = projectMercator(curLat, curLng, baseZoom);
        const ptWorldX = centerWorld.x + (sx - rect.width * 0.5) / subScale;
        const ptWorldY = centerWorld.y + (sy - rect.height * 0.5) / subScale;
        return unprojectMercator(ptWorldX, ptWorldY, baseZoom);
      }

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const rect = canvas.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      /* ── Data Calibration & Normalization ─────────────────────────── */
      function cleanRouteEndpointLabel(raw, fallback) {
        if (!raw || typeof raw !== 'string') return fallback;
        const stripped = raw.split(',')[0].trim();
        if (!stripped) return fallback;
        return stripped.toUpperCase().slice(0, 22);
      }

      function formatShortDate(dateStr, dayName, upper = false) {
        if (!dateStr || typeof dateStr !== 'string') return dayName || '—';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return `${dayName || ''} ${dateStr}`.trim();
        const mIdx = Math.max(0, Math.min(11, parseInt(parts[1], 10) - 1));
        const dayNum = parts[2];
        const dName = dayName || '';
        const monthArr = upper ? MONTHS_ES : MONTHS_TITLE;
        const label = `${dName} ${dayNum} ${monthArr[mIdx]}`.trim();
        return upper ? label.toUpperCase() : label;
      }

      function formatMMSS(sec) {
        const s = Math.max(0, Math.round(sec));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
      }

      function formatClockMMSS(sec) {
        const s = Math.max(0, Math.floor(sec));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
      }

      function formatClockTOD(sec) {
        const s = Math.max(0, Math.floor(sec));
        const h = Math.floor(s / 3600) % 24;
        const m = Math.floor((s % 3600) / 60);
        const r = s % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
      }

      function formatDelta(deltaSec) {
        const s = Math.max(0, Math.round(deltaSec));
        if (s === 0) return 'PB';
        const m = Math.floor(s / 60);
        const r = s % 60;
        return `+${m}:${String(r).padStart(2, '0')}`;
      }

      function formatHM(sec) {
        const s = Math.max(0, Math.floor(sec));
        const h = Math.floor(s / 3600) % 24;
        const m = Math.floor((s % 3600) / 60);
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }

      function buildRouteFilterBuckets(allTrips) {
        const counts = new Map();
        for (const t of allTrips) {
          const r = t.routeType || 'Ruta';
          counts.set(r, (counts.get(r) || 0) + 1);
        }
        const sortedRoutes = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]);
        if (sortedRoutes.length <= 1) {
          return [];
        }

        const primary = [];
        let hasOther = false;
        for (let i = 0; i < sortedRoutes.length; i++) {
          const [name, count] = sortedRoutes[i];
          if (i < 2 && count >= 5) {
            primary.push(name);
          } else {
            hasOther = true;
          }
        }

        if (primary.length === 0) {
          return sortedRoutes.slice(0, 3).map(([name]) => ({ id: name, label: name }));
        }

        const buckets = [{ id: 'ALL', label: 'Todas' }];
        for (const name of primary) {
          buckets.push({ id: name, label: name });
        }
        if (hasOther) {
          buckets.push({ id: 'OTHER', label: 'Otras' });
        }
        return buckets;
      }

      function tripMatchesFilter(trip) {
        if (activeRouteFilter === 'ALL') return true;
        if (activeRouteFilter === 'OTHER') {
          const primaryIds = new Set(routeCategories.filter(b => b.id !== 'ALL' && b.id !== 'OTHER').map(b => b.id));
          return !primaryIds.has(trip.routeType);
        }
        return trip.routeType === activeRouteFilter;
      }

      function getFilteredTrips() {
        return trips.filter(tripMatchesFilter);
      }

      function fitCorridorBounds(instant = false) {
        const rect = canvas.getBoundingClientRect();
        const w = Math.max(320, rect.width || window.innerWidth);
        const h = Math.max(240, rect.height || window.innerHeight);

        const padTop = 76;
        const padBottom = 36;
        const padSide = w < 520 ? 34 : 72;
        const availW = Math.max(120, w - padSide * 2);
        const availH = Math.max(120, h - padTop - padBottom);

        const nw = projectMercator(CORRIDOR_BOUNDS.maxLat, CORRIDOR_BOUNDS.minLng, 0);
        const se = projectMercator(CORRIDOR_BOUNDS.minLat, CORRIDOR_BOUNDS.maxLng, 0);
        const worldDx = Math.max(1e-7, Math.abs(se.x - nw.x));
        const worldDy = Math.max(1e-7, Math.abs(se.y - nw.y));

        const zoomX = Math.log2(availW / worldDx);
        const zoomY = Math.log2(availH / worldDy);
        const fitZoom = Math.max(11.0, Math.min(16.2, Math.min(zoomX, zoomY)));

        const centerLat = (CORRIDOR_BOUNDS.minLat + CORRIDOR_BOUNDS.maxLat) * 0.5;
        const centerLng = (CORRIDOR_BOUNDS.minLng + CORRIDOR_BOUNDS.maxLng) * 0.5;

        // Slight visual vertical offset because HUD sits at top-left
        const centerWorld = projectMercator(centerLat, centerLng, Math.floor(fitZoom));
        const subScale = Math.pow(2, fitZoom - Math.floor(fitZoom));
        const offsetLatLng = unprojectMercator(
          centerWorld.x,
          centerWorld.y - ((padTop - padBottom) * 0.35) / subScale,
          Math.floor(fitZoom)
        );

        targetLat = offsetLatLng.lat;
        targetLng = offsetLatLng.lng;
        targetZoom = fitZoom;

        if (instant) {
          curLat = targetLat;
          curLng = targetLng;
          curZoom = targetZoom;
        }
      }

      function calibrateDataset(rawTrips, routeMeta) {
        if (!Array.isArray(rawTrips) || rawTrips.length === 0) return;

        trips = rawTrips
          .filter(t => t && Array.isArray(t.pts) && t.pts.length >= 2)
          .map((t, idx) => {
            const pts = t.pts;
            const lastPt = pts[pts.length - 1];
            const durationSec = Number(t.durationSec) > 0 ? Number(t.durationSec) : Math.max(60, Number(lastPt[0]) || 0);
            let maxSpd = Number(t.maxSpeed) || 0;
            if (!maxSpd) {
              for (let i = 0; i < pts.length; i++) {
                if (pts[i][3] > maxSpd) maxSpd = pts[i][3];
              }
            }
            const startSec = Number.isFinite(Number(t.startSecOfDay)) ? Number(t.startSecOfDay) : 26100;
            const endSec = Number.isFinite(Number(t.endSecOfDay)) ? Number(t.endSecOfDay) : startSec + durationSec;

            // Precompute lightweight spectral polyline indices (every ~3-4 pts + endpoints)
            const spectralIdx = [0];
            const stride = pts.length > 180 ? 4 : 3;
            for (let i = stride; i < pts.length - 1; i += stride) {
              spectralIdx.push(i);
            }
            if (spectralIdx[spectralIdx.length - 1] !== pts.length - 1) {
              spectralIdx.push(pts.length - 1);
            }

            return {
              id: String(t.id || `trip_${idx}`),
              rank: Number(t.rank) || 0,
              date: String(t.date || ''),
              dayName: String(t.dayName || ''),
              startTime: String(t.startTime || formatHM(startSec)),
              startSecOfDay: startSec,
              endSecOfDay: endSec,
              durationSec,
              distKm: Number(t.distKm) || 0,
              avgSpeed: Number(t.avgSpeed) || 0,
              maxSpeed: maxSpd,
              routeType: String(t.routeType || 'Ruta habitual'),
              pts,
              spectralIdx
            };
          });

        if (trips.length === 0) return;

        // Sort by duration ascending for PB / rank
        const byDuration = [...trips].sort((a, b) => a.durationSec - b.durationSec);
        byDuration.forEach((t, i) => {
          if (!t.rank) t.rank = i + 1;
        });
        pbTrip = byDuration[0];

        // Most recent by date (tie-break by startSecOfDay)
        const byDateDesc = [...trips].sort((a, b) => {
          const cmp = b.date.localeCompare(a.date);
          return cmp !== 0 ? cmp : b.startSecOfDay - a.startSecOfDay;
        });
        latestTrip = byDateDesc[0];

        // Compute true start/finish centroids & bounding box
        let sumSLat = 0, sumSLng = 0, sumFLat = 0, sumFLng = 0;
        let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
        let maxDur = 0;
        let minTod = 86400;
        let maxTod = 0;

        for (const t of trips) {
          const first = t.pts[0];
          const last = t.pts[t.pts.length - 1];
          sumSLat += first[1];
          sumSLng += first[2];
          sumFLat += last[1];
          sumFLng += last[2];

          if (t.durationSec > maxDur) maxDur = t.durationSec;
          if (t.startSecOfDay < minTod) minTod = t.startSecOfDay;
          if (t.endSecOfDay > maxTod) maxTod = t.endSecOfDay;

          for (let i = 0; i < t.pts.length; i += 2) {
            const lat = t.pts[i][1];
            const lng = t.pts[i][2];
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
            if (lng < minLng) minLng = lng;
            if (lng > maxLng) maxLng = lng;
          }
          if (last[1] < minLat) minLat = last[1];
          if (last[1] > maxLat) maxLat = last[1];
          if (last[2] < minLng) minLng = last[2];
          if (last[2] > maxLng) maxLng = last[2];
        }

        const startName = routeMeta?.startLabel ? cleanRouteEndpointLabel(routeMeta.startLabel, 'ORIGEN') : 'LA CEIBA';
        const endName = routeMeta?.endLabel ? cleanRouteEndpointLabel(routeMeta.endLabel, 'DESTINO') : 'UNINORTE';

        START_PT = {
          lat: sumSLat / trips.length,
          lng: sumSLng / trips.length,
          name: startName
        };
        FINISH_PT = {
          lat: sumFLat / trips.length,
          lng: sumFLng / trips.length,
          name: endName
        };
        CORRIDOR_BOUNDS = { minLat, maxLat, minLng, maxLng };

        if (routeSubtitleEl) {
          routeSubtitleEl.textContent = `${START_PT.name} → ${FINISH_PT.name}`;
        }

        // Time bounds
        REL_MAX_SEC = Math.max(60, Math.ceil(maxDur));
        TOD_MIN_SEC = Math.max(0, Math.floor((minTod - 240) / 300) * 300);
        TOD_MAX_SEC = Math.min(86400, Math.ceil((maxTod + 300) / 300) * 300);
        if (TOD_MAX_SEC <= TOD_MIN_SEC) {
          TOD_MIN_SEC = 24600;
          TOD_MAX_SEC = 31800;
        }

        curRelativeTimeSec = 0;
        curTimeOfDaySec = TOD_MIN_SEC;
        selectedTripId = null;
        activeRouteFilter = 'ALL';
        routeCategories = buildRouteFilterBuckets(trips);

        prevStatuses.clear();
        finishRipples = [];
        lastHudKey = '';
        isHudInit = false;

        renderRouteFilterBar();
        updateDrawerSummaryMetrics();
        renderScrubberTicks();
        syncScrubberBounds();
        fitCorridorBounds(true);
        cameraMode = 'overview';
        userHasManipulatedCamera = false;
        updateCameraBtnUI();
        updatePlayUI();
        updateStandingsList(true);
      }

      /* ── Binary Search & Trailing Kinematics ──────────────────────── */
      function getTripStateAtRelativeTime(trip, relSec) {
        const pts = trip.pts;
        const len = pts.length;
        if (!pts || len === 0) return null;

        if (relSec <= 0) {
          return {
            lat: pts[0][1],
            lng: pts[0][2],
            speed: pts[0][3],
            heading: pts[0][4],
            finished: false,
            finishTime: null,
            idx: 0
          };
        }

        const totalDur = trip.durationSec;
        if (relSec >= totalDur) {
          const last = pts[len - 1];
          return {
            lat: last[1],
            lng: last[2],
            speed: 0,
            heading: last[4],
            finished: true,
            finishTime: totalDur,
            idx: len - 1
          };
        }

        let low = 0;
        let high = len - 1;
        while (low <= high) {
          const mid = (low + high) >> 1;
          if (pts[mid][0] <= relSec) {
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }

        const idx1 = Math.max(0, low - 1);
        const idx2 = Math.min(len - 1, idx1 + 1);
        const p1 = pts[idx1];
        const p2 = pts[idx2];
        const dt = p2[0] - p1[0];
        const ratio = dt > 0 ? Math.max(0, Math.min(1, (relSec - p1[0]) / dt)) : 0;

        return {
          lat: p1[1] + (p2[1] - p1[1]) * ratio,
          lng: p1[2] + (p2[2] - p1[2]) * ratio,
          speed: Math.round(p1[3] + (p2[3] - p1[3]) * ratio),
          heading: p1[4],
          finished: false,
          finishTime: null,
          idx: idx1
        };
      }

      function findStartIdxForTime(pts, minRelSec) {
        if (minRelSec <= 0) return 0;
        let low = 0;
        let high = pts.length - 1;
        while (low <= high) {
          const mid = (low + high) >> 1;
          if (pts[mid][0] < minRelSec) low = mid + 1;
          else high = mid - 1;
        }
        return Math.max(0, low - 1);
      }

      /* ── Scrubber Micro-Ticks & Bounds ────────────────────────────── */
      function renderScrubberTicks() {
        const visibleTrips = getFilteredTrips();
        if (!visibleTrips.length) {
          scrubberTicksEl.innerHTML = '';
          return;
        }

        const frag = document.createDocumentFragment();
        const todRange = Math.max(1, TOD_MAX_SEC - TOD_MIN_SEC);

        for (const t of visibleTrips) {
          let pct = 0;
          if (currentMode === 'relative') {
            pct = (t.durationSec / REL_MAX_SEC) * 100;
          } else {
            pct = ((t.startSecOfDay - TOD_MIN_SEC) / todRange) * 100;
          }
          pct = Math.max(0.5, Math.min(99.5, pct));

          const tick = document.createElement('span');
          const isPb = pbTrip && t.id === pbTrip.id;
          const isLatest = latestTrip && t.id === latestTrip.id && !isPb;
          tick.className = 'gr-scrub-tick' + (isPb ? ' is-pb' : isLatest ? ' is-latest' : '');
          tick.style.left = pct.toFixed(2) + '%';
          frag.appendChild(tick);
        }

        scrubberTicksEl.innerHTML = '';
        scrubberTicksEl.appendChild(frag);
      }

      function syncScrubberBounds() {
        if (currentMode === 'relative') {
          timeSlider.min = 0;
          timeSlider.max = REL_MAX_SEC;
          timeSlider.value = curRelativeTimeSec;
          scrubberStartLabel.textContent = '00:00';
          scrubberEndLabel.textContent = formatMMSS(REL_MAX_SEC);
        } else {
          timeSlider.min = TOD_MIN_SEC;
          timeSlider.max = TOD_MAX_SEC;
          timeSlider.value = curTimeOfDaySec;
          scrubberStartLabel.textContent = formatHM(TOD_MIN_SEC);
          scrubberEndLabel.textContent = formatHM(TOD_MAX_SEC);
        }
        updateScrubberProgressUI();
      }

      function updateScrubberProgressUI() {
        let pct = 0;
        if (currentMode === 'relative') {
          pct = (curRelativeTimeSec / Math.max(1, REL_MAX_SEC)) * 100;
          timeSlider.value = curRelativeTimeSec;
        } else {
          pct = ((curTimeOfDaySec - TOD_MIN_SEC) / Math.max(1, TOD_MAX_SEC - TOD_MIN_SEC)) * 100;
          timeSlider.value = curTimeOfDaySec;
        }
        pct = Math.max(0, Math.min(100, pct));
        const pctStr = pct.toFixed(3) + '%';
        scrubberFill.style.width = pctStr;
        scrubberThumb.style.left = pctStr;
      }

      /* ── Lights Out Sequence (0.45s crisp horological launch) ────── */
      function clearLightsOutSequence() {
        if (!lightsOutSequence) return;
        lightsOutSequence.timers.forEach(clearTimeout);
        lightsOutSequence = null;
        lightsSeqEl.classList.remove('is-visible');
        lightDots.forEach(d => d.classList.remove('is-lit'));
      }

      function startLightsOutAndPlay() {
        clearLightsOutSequence();
        lightsSeqEl.classList.add('is-visible');
        lightDots.forEach(d => d.classList.remove('is-lit'));

        const timers = [];
        lightsOutSequence = { timers };

        // 0ms: Dot 1
        lightDots[0].classList.add('is-lit');
        playTick(680, 0.018, 0.022, 'sine');

        // 140ms: Dot 2
        timers.push(setTimeout(() => {
          if (!lightsOutSequence) return;
          lightDots[1].classList.add('is-lit');
          playTick(860, 0.018, 0.022, 'sine');
        }, 140));

        // 280ms: Dot 3
        timers.push(setTimeout(() => {
          if (!lightsOutSequence) return;
          lightDots[2].classList.add('is-lit');
          playTick(1080, 0.02, 0.024, 'sine');
        }, 280));

        // 440ms: Lights Out -> Launch
        timers.push(setTimeout(() => {
          if (!lightsOutSequence) return;
          clearLightsOutSequence();
          playTick(1420, 0.028, 0.026, 'triangle');
          engagePlayback();
        }, 440));
      }

      function engagePlayback() {
        isPlaying = true;
        if (!userHasManipulatedCamera && cameraMode === 'overview') {
          cameraMode = 'auto';
          updateCameraBtnUI();
        }
        updatePlayUI();
      }

      /* ── UI State Updaters ────────────────────────────────────────── */
      function updatePlayUI() {
        const isLaunchPending = Boolean(lightsOutSequence);
        if (isPlaying || isLaunchPending) {
          iconPlay.classList.add('is-hidden');
          iconPause.classList.remove('is-hidden');
          labelPlay.textContent = 'PAUSA';
        } else {
          iconPlay.classList.remove('is-hidden');
          iconPause.classList.add('is-hidden');
          const isEnd = (currentMode === 'relative' && curRelativeTimeSec >= REL_MAX_SEC) ||
                        (currentMode === 'timeofday' && curTimeOfDaySec >= TOD_MAX_SEC);
          labelPlay.textContent = isEnd ? 'REPETIR' : 'INICIAR';
        }
      }

      function updateCameraBtnUI() {
        const isFollow = cameraMode === 'auto' || cameraMode === 'follow-car';
        btnCameraToggle.classList.toggle('is-active', isFollow);
        iconCamOverview.classList.toggle('is-hidden', isFollow);
        iconCamFollow.classList.toggle('is-hidden', !isFollow);
        btnCameraToggle.title = isFollow ? 'Vista general del corredor' : 'Seguir pelotón';
      }

      function updateAudioBtnUI() {
        btnAudioToggle.classList.toggle('is-active', audioEnabled);
        iconAudioOn.classList.toggle('is-hidden', !audioEnabled);
        iconAudioOff.classList.toggle('is-hidden', audioEnabled);
      }

      function renderHudSubline(state) {
        const { activeRacers, selectedRacer, countArrived, totalFiltered } = state;
        let key = '';
        let html = '';

        if (selectedRacer) {
          const t = selectedRacer.trip;
          const spd = selectedRacer.status === 'active'
            ? `${selectedRacer.state.speed} KM/H`
            : (selectedRacer.status === 'arrived' ? formatMMSS(t.durationSec) : t.startTime);
          const deltaStr = pbTrip && t.id !== pbTrip.id
            ? ` · ${formatDelta(t.durationSec - pbTrip.durationSec)}`
            : (pbTrip && t.id === pbTrip.id ? ' · RÉCORD' : '');
          const labelText = `${formatShortDate(t.date, t.dayName, true)} · ${spd} · ${t.routeType.toUpperCase()}${deltaStr}`;
          key = `sel:${t.id}:${labelText}`;
          if (key !== lastHudKey) {
            lastHudKey = key;
            const dotColor = pbTrip && t.id === pbTrip.id
              ? 'var(--accent-amber)'
              : (latestTrip && t.id === latestTrip.id ? 'var(--accent-volt)' : 'var(--text-primary)');
            html = `<button type="button" id="hud-release-car" class="gr-subline-chip" title="Soltar seguimiento">
              <span class="gr-dot-inline" style="background:${dotColor}"></span>
              <span class="gr-subline-chip-text">${labelText}</span>
              <span style="color:var(--text-secondary);margin-left:2px;flex-shrink:0;">×</span>
            </button>`;
            hudSublineEl.innerHTML = html;
            const relBtn = document.getElementById('hud-release-car');
            if (relBtn) {
              relBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playTick(920);
                selectedTripId = null;
                cameraMode = userHasManipulatedCamera ? 'manual' : 'auto';
                updateCameraBtnUI();
                lastHudKey = '';
                updateStandingsList(true);
              });
            }
          }
          return;
        }

        if (activeRacers.length > 0) {
          const lead = activeRacers[0];
          const t = lead.trip;
          const text = `${formatShortDate(t.date, t.dayName, true)} · ${lead.state.speed} KM/H · ${t.routeType.toUpperCase()}`;
          key = `lead:${t.id}:${text}`;
          if (key !== lastHudKey) {
            lastHudKey = key;
            hudSublineEl.innerHTML = `<span class="gr-dot-inline" style="background:var(--accent-amber)"></span><span>PUNTA</span><span>·</span><span style="color:var(--text-primary)">${text}</span>`;
          }
          return;
        }

        if (totalFiltered > 0 && countArrived === totalFiltered && pbTrip) {
          const pbText = `RÉCORD ${formatMMSS(pbTrip.durationSec)} · ${formatShortDate(pbTrip.date, pbTrip.dayName, true)} · ${pbTrip.routeType.toUpperCase()}`;
          key = `done:${pbText}`;
          if (key !== lastHudKey) {
            lastHudKey = key;
            hudSublineEl.innerHTML = `<span class="gr-dot-inline" style="background:var(--accent-amber)"></span><span style="color:var(--text-primary)">${pbText}</span>`;
          }
          return;
        }

        // Idle legend
        const pbPart = pbTrip ? `RÉCORD ${formatMMSS(pbTrip.durationSec)}` : 'RÉCORD --:--';
        const latPart = latestTrip ? `ÚLTIMO ${formatMMSS(latestTrip.durationSec)}` : '';
        key = `idle:${pbPart}:${latPart}:${currentMode}:${curRelativeTimeSec}:${curTimeOfDaySec}`;
        if (!isHudInit || key !== lastHudKey) {
          lastHudKey = key;
          isHudInit = true;
          if (latestTrip && (!pbTrip || latestTrip.id !== pbTrip.id)) {
            hudSublineEl.innerHTML =
              `<span class="gr-dot-inline" style="background:var(--accent-amber)"></span><span>${pbPart}</span>` +
              `<span style="opacity:0.45">·</span>` +
              `<span class="gr-dot-inline" style="background:var(--accent-volt)"></span><span>${latPart}</span>`;
          } else {
            hudSublineEl.innerHTML = `<span class="gr-dot-inline" style="background:var(--accent-amber)"></span><span>${pbPart}</span>`;
          }
        }
      }

      /* ── Drawer Metrics, Route Filters & Standings List ───────────── */
      function renderRouteFilterBar() {
        if (!routeCategories || routeCategories.length <= 1) {
          routeFiltersEl.classList.add('is-hidden');
          routeFiltersEl.innerHTML = '';
          return;
        }
        routeFiltersEl.classList.remove('is-hidden');
        routeFiltersEl.innerHTML = routeCategories.map(cat =>
          `<button type="button" class="gr-filter-btn mono ${activeRouteFilter === cat.id ? 'is-active' : ''}" data-route-filter="${cat.id}">${cat.label}</button>`
        ).join('');

        routeFiltersEl.querySelectorAll('[data-route-filter]').forEach(btn => {
          btn.addEventListener('click', () => {
            playTick(1050);
            activeRouteFilter = btn.dataset.routeFilter;
            routeFiltersEl.querySelectorAll('[data-route-filter]').forEach(b => {
              b.classList.toggle('is-active', b.dataset.routeFilter === activeRouteFilter);
            });
            updateDrawerSummaryMetrics();
            renderScrubberTicks();
            updateStandingsList(true);
            lastHudKey = '';
          });
        });
      }

      function updateDrawerSummaryMetrics() {
        const subset = getFilteredTrips();
        if (!subset.length) {
          metricPbEl.textContent = '--:--';
          metricMedianEl.textContent = '--:--';
          metricMaxSpdEl.textContent = '-- KM/H';
          return;
        }
        const durs = subset.map(t => t.durationSec).sort((a, b) => a - b);
        const pbSec = durs[0];
        const mid = Math.floor(durs.length / 2);
        const medianSec = durs.length % 2 === 1 ? durs[mid] : (durs[mid - 1] + durs[mid]) * 0.5;
        let maxSpd = 0;
        for (const t of subset) {
          if (t.maxSpeed > maxSpd) maxSpd = t.maxSpeed;
        }
        metricPbEl.textContent = formatMMSS(pbSec);
        metricMedianEl.textContent = formatMMSS(medianSec);
        metricMaxSpdEl.textContent = `${Math.round(maxSpd)} KM/H`;
      }

      function updateStandingsList(force = false) {
        if (!isDrawerOpen && !force) return;
        const now = performance.now();
        if (!force && now - lastDrawerUpdateMs < 150) return;
        lastDrawerUpdateMs = now;

        drawerTitleEl.textContent = currentMode === 'relative' ? 'CLASIFICACIÓN' : 'JORNADA HORA REAL';

        const filteredRacers = currentRenderedRacers.filter(r => r.matchesFilter);
        let sorted = [];

        if (currentMode === 'relative') {
          if (curRelativeTimeSec <= 0) {
            sorted = [...filteredRacers].sort((a, b) => a.trip.durationSec - b.trip.durationSec);
          } else {
            const arrived = filteredRacers.filter(r => r.status === 'arrived').sort((a, b) => a.trip.durationSec - b.trip.durationSec);
            const active = filteredRacers.filter(r => r.status === 'active').sort((a, b) => a.distKm - b.distKm);
            const waiting = filteredRacers.filter(r => r.status === 'waiting').sort((a, b) => a.trip.durationSec - b.trip.durationSec);
            sorted = [...arrived, ...active, ...waiting];
          }
        } else {
          const active = filteredRacers.filter(r => r.status === 'active').sort((a, b) => a.distKm - b.distKm);
          const arrived = filteredRacers.filter(r => r.status === 'arrived').sort((a, b) => b.trip.endSecOfDay - a.trip.endSecOfDay);
          const waiting = filteredRacers.filter(r => r.status === 'waiting').sort((a, b) => a.trip.startSecOfDay - b.trip.startSecOfDay);
          sorted = [...active, ...arrived, ...waiting];
        }

        const pbSec = pbTrip ? pbTrip.durationSec : 0;
        const chunks = [];

        for (let i = 0; i < sorted.length; i++) {
          const r = sorted[i];
          const t = r.trip;
          const isPb = pbTrip && t.id === pbTrip.id;
          const isLatest = latestTrip && t.id === latestTrip.id && !isPb;
          const isSel = r.isSelected;

          const dotColor = isPb
            ? 'var(--accent-amber)'
            : (isLatest ? 'var(--accent-volt)' : 'var(--text-muted)');

          const rankNum = currentMode === 'relative' && curRelativeTimeSec > 0 ? i + 1 : t.rank;
          const rankColor = isPb ? 'var(--accent-amber)' : 'var(--text-muted)';

          let rightTop = '';
          let rightSub = '';

          if (currentMode === 'relative') {
            if (curRelativeTimeSec <= 0 || r.status === 'arrived') {
              rightTop = formatMMSS(t.durationSec);
              rightSub = formatDelta(t.durationSec - pbSec);
            } else if (r.status === 'active') {
              rightTop = `${r.state.speed} KM/H`;
              rightSub = `${r.distKm.toFixed(1)} KM`;
            } else {
              rightTop = formatMMSS(t.durationSec);
              rightSub = formatDelta(t.durationSec - pbSec);
            }
          } else {
            if (r.status === 'active') {
              rightTop = `${r.state.speed} KM/H`;
              rightSub = `${r.distKm.toFixed(1)} KM`;
            } else if (r.status === 'arrived') {
              rightTop = formatMMSS(t.durationSec);
              rightSub = formatHM(t.endSecOfDay);
            } else {
              rightTop = t.startTime;
              rightSub = formatMMSS(t.durationSec);
            }
          }

          const topColor = isPb
            ? 'var(--accent-amber)'
            : (isLatest ? 'var(--accent-volt)' : (r.status === 'active' ? 'var(--text-primary)' : 'var(--text-primary)'));

          const tagBadge = isPb
            ? `<span style="color:var(--accent-amber);margin-left:5px;">PB</span>`
            : (isLatest ? `<span style="color:var(--accent-volt);margin-left:5px;">ÚLTIMO</span>` : '');

          chunks.push(
            `<div class="gr-trip-row ${isSel ? 'is-selected' : ''}" data-id="${t.id}">` +
              `<div class="gr-trip-left">` +
                `<span class="gr-trip-rank mono tabular" style="color:${rankColor}">#${rankNum}</span>` +
                `<span class="gr-trip-dot" style="background:${dotColor}"></span>` +
                `<div class="gr-trip-info">` +
                  `<div class="gr-trip-date">${formatShortDate(t.date, t.dayName, false)}${tagBadge}</div>` +
                  `<div class="gr-trip-meta mono tabular">${t.startTime} · ${t.routeType}</div>` +
                `</div>` +
              `</div>` +
              `<div class="gr-trip-right mono tabular">` +
                `<div class="gr-trip-stat" style="color:${topColor}">${rightTop}</div>` +
                `<div class="gr-trip-delta">${rightSub}</div>` +
              `</div>` +
            `</div>`
          );
        }

        standingsScroll.innerHTML = chunks.join('');
      }

      /* ── Canvas Drawing Primitives ────────────────────────────────── */
      function drawTechnicalGrid(w, h, baseZoom, subScale, centerWorld, pal) {
        const tilePx = 256 * subScale;
        let step = tilePx / 2;
        while (step < 52) step *= 2;
        while (step > 128) step *= 0.5;

        const offsetX = ((w * 0.5 - centerWorld.x * subScale) % step + step) % step;
        const offsetY = ((h * 0.5 - centerWorld.y * subScale) % step + step) % step;

        ctx.save();
        ctx.strokeStyle = pal.gridStroke;
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = offsetX; x < w; x += step) {
          const rx = Math.round(x) + 0.5;
          ctx.moveTo(rx, 0);
          ctx.lineTo(rx, h);
        }
        for (let y = offsetY; y < h; y += step) {
          const ry = Math.round(y) + 0.5;
          ctx.moveTo(0, ry);
          ctx.lineTo(w, ry);
        }
        ctx.stroke();
        ctx.restore();
      }

      function drawOriginAndFinishPins(w, h, pal) {
        const startPx = latLngToScreen(START_PT.lat, START_PT.lng, w, h);
        const finishPx = latLngToScreen(FINISH_PT.lat, FINISH_PT.lng, w, h);

        // Origin Pin: concentric geometric circles + micro label
        ctx.save();
        ctx.beginPath();
        ctx.arc(startPx.x, startPx.y, 9, 0, Math.PI * 2);
        ctx.strokeStyle = pal.accentVolt;
        ctx.globalAlpha = 0.4;
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(startPx.x, startPx.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = pal.accentVolt;
        ctx.globalAlpha = 1;
        ctx.fill();

        ctx.font = '500 10px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = pal.labelHalo;
        ctx.strokeText(START_PT.name, startPx.x + 13, startPx.y);
        ctx.fillStyle = pal.textPrimary;
        ctx.globalAlpha = 0.78;
        ctx.fillText(START_PT.name, startPx.x + 13, startPx.y);
        ctx.restore();

        // Finish Pin: architectural target ring + 2x2 geometric flag (zero emojis)
        ctx.save();
        ctx.beginPath();
        ctx.arc(finishPx.x, finishPx.y, 13, 0, Math.PI * 2);
        ctx.strokeStyle = pal.accentAmber;
        ctx.globalAlpha = 0.35;
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(finishPx.x, finishPx.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = pal.accentAmber;
        ctx.globalAlpha = 1;
        ctx.fill();

        // 2x2 micro geometric checkered flag vector
        const fx = finishPx.x + 14;
        const fy = finishPx.y - 4;
        const cell = 3.5;
        ctx.fillStyle = pal.accentAmber;
        ctx.fillRect(fx, fy, cell, cell);
        ctx.fillRect(fx + cell, fy + cell, cell, cell);
        ctx.fillStyle = pal.textPrimary;
        ctx.globalAlpha = 0.45;
        ctx.fillRect(fx + cell, fy, cell, cell);
        ctx.fillRect(fx, fy + cell, cell, cell);

        ctx.globalAlpha = 1;
        ctx.font = '600 10px "JetBrains Mono", monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 3;
        ctx.strokeStyle = pal.labelHalo;
        ctx.strokeText(FINISH_PT.name, fx + cell * 2 + 5, finishPx.y);
        ctx.fillStyle = pal.accentAmber;
        ctx.fillText(FINISH_PT.name, fx + cell * 2 + 5, finishPx.y);
        ctx.restore();
      }

      function drawSpectralBaseMap(w, h, baseZoom, subScale, centerWorld, pal) {
        const halfW = w * 0.5;
        const halfH = h * 0.5;
        const cx = centerWorld.x;
        const cy = centerWorld.y;
        const worldScale = 256 * Math.pow(2, baseZoom);
        const rad = Math.PI / 180;

        // First draw dimmed out-of-filter routes (if a route filter is active), then active spectral routes
        const passes = activeRouteFilter === 'ALL' ? [true] : [false, true];
        for (const wantMatched of passes) {
          ctx.save();
          ctx.beginPath();
          for (const t of trips) {
            const matched = tripMatchesFilter(t);
            if (matched !== wantMatched) continue;
            const pts = t.pts;
            const sIdx = t.spectralIdx;
            for (let k = 0; k < sIdx.length; k++) {
              const pt = pts[sIdx[k]];
              const px = ((pt[2] + 180) / 360) * worldScale;
              const sinLat = Math.sin(pt[1] * rad);
              const py = (0.5 - Math.log((1 + sinLat) / (1 - sinLat)) / (4 * Math.PI)) * worldScale;
              const sx = halfW + (px - cx) * subScale;
              const sy = halfH + (py - cy) * subScale;
              if (k === 0) ctx.moveTo(sx, sy);
              else ctx.lineTo(sx, sy);
            }
          }
          ctx.strokeStyle = wantMatched ? pal.spectralBase : pal.spectralDim;
          ctx.lineWidth = 1;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawTripSlice(trip, fromIdx, toIdx, curPos, w, h) {
        const pts = trip.pts;
        if (toIdx <= fromIdx && fromIdx === 0) {
          const p0 = latLngToScreen(pts[0][1], pts[0][2], w, h);
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(curPos.x, curPos.y);
          return;
        }
        const first = latLngToScreen(pts[fromIdx][1], pts[fromIdx][2], w, h);
        ctx.moveTo(first.x, first.y);
        for (let i = fromIdx + 1; i <= toIdx; i++) {
          const p = latLngToScreen(pts[i][1], pts[i][2], w, h);
          ctx.lineTo(p.x, p.y);
        }
        ctx.lineTo(curPos.x, curPos.y);
      }

      /* ── Main Render Loop ─────────────────────────────────────────── */
      function render(nowMs) {
        const rect = canvas.getBoundingClientRect();
        const w = rect.width;
        const h = rect.height;
        if (w <= 0 || h <= 0) return;

        const pal = THEME_PALETTES[currentTheme];

        // 1. Background Void
        ctx.fillStyle = pal.bgVoid;
        ctx.fillRect(0, 0, w, h);

        // 2. Projection & Basemap Tiles
        const baseZoom = Math.max(1, Math.min(17, Math.floor(curZoom)));
        const subScale = Math.pow(2, curZoom - baseZoom);
        const centerWorld = projectMercator(curLat, curLng, baseZoom);

        const minWorldX = centerWorld.x - (w * 0.5) / subScale;
        const maxWorldX = centerWorld.x + (w * 0.5) / subScale;
        const minWorldY = centerWorld.y - (h * 0.5) / subScale;
        const maxWorldY = centerWorld.y + (h * 0.5) / subScale;

        const minTileX = Math.floor(minWorldX / 256);
        const maxTileX = Math.floor(maxWorldX / 256);
        const minTileY = Math.floor(minWorldY / 256);
        const maxTileY = Math.floor(maxWorldY / 256);

        let drawnTiles = 0;
        let expectedTiles = 0;

        ctx.save();
        ctx.globalAlpha = pal.tileAlpha;
        for (let tx = minTileX; tx <= maxTileX; tx++) {
          for (let ty = minTileY; ty <= maxTileY; ty++) {
            expectedTiles++;
            const tileImg = getTile(currentTheme, baseZoom, tx, ty);
            if (tileImg && tileImg.complete && tileImg.naturalWidth > 0) {
              const tileScreenX = w * 0.5 + (tx * 256 - centerWorld.x) * subScale;
              const tileScreenY = h * 0.5 + (ty * 256 - centerWorld.y) * subScale;
              ctx.drawImage(tileImg, tileScreenX, tileScreenY, 256 * subScale, 256 * subScale);
              drawnTiles++;
            }
          }
        }
        ctx.restore();

        // Warm tint over light map tiles or subtle technical grid if tiles missing/offline
        if (currentTheme === 'light' && drawnTiles > 0) {
          ctx.save();
          ctx.fillStyle = 'rgba(242, 240, 235, 0.28)';
          ctx.fillRect(0, 0, w, h);
          ctx.restore();
        }
        if (drawnTiles < expectedTiles) {
          drawTechnicalGrid(w, h, baseZoom, subScale, centerWorld, pal);
        }

        // 3. Spectral Heat Silhouette of the Corridor
        if (trips.length > 0) {
          drawSpectralBaseMap(w, h, baseZoom, subScale, centerWorld, pal);
        }

        // 4. Origin & Finish Architectural Pins
        drawOriginAndFinishPins(w, h, pal);

        // 5. Evaluate All Racers
        const racers = [];
        let countWaiting = 0;
        let countArrived = 0;
        let countFiltered = 0;

        for (const trip of trips) {
          const matchesFilter = tripMatchesFilter(trip);
          let relSec = 0;
          let status = 'active';

          if (currentMode === 'relative') {
            relSec = curRelativeTimeSec;
            if (relSec <= 0) status = 'waiting';
            else if (relSec >= trip.durationSec) status = 'arrived';
            else status = 'active';
          } else {
            if (curTimeOfDaySec < trip.startSecOfDay) {
              status = 'waiting';
              relSec = 0;
            } else if (curTimeOfDaySec >= trip.endSecOfDay) {
              status = 'arrived';
              relSec = trip.durationSec;
            } else {
              status = 'active';
              relSec = curTimeOfDaySec - trip.startSecOfDay;
            }
          }

          if (matchesFilter) {
            countFiltered++;
            if (status === 'waiting') countWaiting++;
            else if (status === 'arrived') countArrived++;
          }

          const state = getTripStateAtRelativeTime(trip, relSec);
          if (!state) continue;

          // Arrival detection for Finish Ripples + Horology Chime
          const prevStatus = prevStatuses.get(trip.id);
          if (matchesFilter && isPlaying && !isScrubbing && prevStatus === 'active' && status === 'arrived') {
            const isPb = pbTrip && trip.id === pbTrip.id;
            const isLatest = latestTrip && trip.id === latestTrip.id && !isPb;
            finishRipples.push({
              lat: state.lat,
              lng: state.lng,
              bornMs: nowMs,
              role: isPb ? 'pb' : (isLatest ? 'latest' : 'swarm')
            });
            playArrivalChime(isPb);
          }
          prevStatuses.set(trip.id, status);

          const pos = latLngToScreen(state.lat, state.lng, w, h);
          const dLat = (FINISH_PT.lat - state.lat) * 111.0;
          const dLng = (FINISH_PT.lng - state.lng) * 111.0 * Math.cos((state.lat * Math.PI) / 180);
          const distKm = Math.sqrt(dLat * dLat + dLng * dLng);

          const isPb = pbTrip && trip.id === pbTrip.id;
          const isLatest = latestTrip && trip.id === latestTrip.id && !isPb;
          const isSelected = trip.id === selectedTripId;

          racers.push({
            trip,
            state,
            relSec,
            pos,
            distKm,
            status,
            matchesFilter,
            isPb,
            isLatest,
            isSelected
          });
        }

        currentRenderedRacers = racers;

        // 6. Kinetic Comet Trails (95s active comets, 2-tier fade) & Full Path for Selected Car
        const COMET_WINDOW_SEC = 100;
        const FADE_SPLIT_SEC = 55;

        // Pass A: Swarm trails (matched filter)
        ctx.save();
        ctx.beginPath();
        for (const r of racers) {
          if (!r.matchesFilter || r.status !== 'active' || r.isPb || r.isLatest || r.isSelected) continue;
          const fadeStart = findStartIdxForTime(r.trip.pts, r.relSec - COMET_WINDOW_SEC);
          const coreStart = findStartIdxForTime(r.trip.pts, r.relSec - FADE_SPLIT_SEC);
          if (coreStart > fadeStart) {
            const splitPos = latLngToScreen(r.trip.pts[coreStart][1], r.trip.pts[coreStart][2], w, h);
            drawTripSlice(r.trip, fadeStart, coreStart, splitPos, w, h);
          }
        }
        ctx.strokeStyle = pal.swarmTrailFade;
        ctx.lineWidth = 1.1;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        ctx.beginPath();
        for (const r of racers) {
          if (!r.matchesFilter || r.status !== 'active' || r.isPb || r.isLatest || r.isSelected) continue;
          const coreStart = findStartIdxForTime(r.trip.pts, r.relSec - FADE_SPLIT_SEC);
          drawTripSlice(r.trip, coreStart, r.state.idx, r.pos, w, h);
        }
        ctx.strokeStyle = pal.swarmTrail;
        ctx.lineWidth = 1.3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        ctx.restore();

        // Pass B: Highlighted Comet Trails (Latest, PB, Selected)
        for (const r of racers) {
          if (!r.isPb && !r.isLatest && !r.isSelected) continue;
          if (!r.matchesFilter && !r.isSelected) continue;

          if (r.isSelected && r.status !== 'waiting') {
            ctx.save();
            ctx.beginPath();
            drawTripSlice(r.trip, 0, r.state.idx, r.pos, w, h);
            ctx.strokeStyle = pal.selectedStroke;
            ctx.lineWidth = 1.9;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.restore();
            continue;
          }

          if (r.status === 'active') {
            const pts = r.trip.pts;
            const fadeStart = findStartIdxForTime(pts, r.relSec - COMET_WINDOW_SEC);
            const coreStart = findStartIdxForTime(pts, r.relSec - FADE_SPLIT_SEC);
            const color = r.isPb ? pal.accentAmber : pal.accentVolt;

            ctx.save();
            if (coreStart > fadeStart) {
              ctx.beginPath();
              const splitPos = latLngToScreen(pts[coreStart][1], pts[coreStart][2], w, h);
              drawTripSlice(r.trip, fadeStart, coreStart, splitPos, w, h);
              ctx.strokeStyle = color;
              ctx.globalAlpha = 0.28;
              ctx.lineWidth = r.isPb ? 1.8 : 1.5;
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.stroke();
            }

            ctx.beginPath();
            drawTripSlice(r.trip, coreStart, r.state.idx, r.pos, w, h);
            ctx.strokeStyle = color;
            ctx.globalAlpha = 0.88;
            ctx.lineWidth = r.isPb ? 2.2 : 1.8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.restore();
          }
        }

        // 7. Finish Ripples (700ms ease-out rings)
        if (finishRipples.length > 0) {
          const aliveRipples = [];
          for (const rp of finishRipples) {
            const age = nowMs - rp.bornMs;
            if (age >= 700) continue;
            aliveRipples.push(rp);
            const t = age / 700;
            const ease = 1 - Math.pow(1 - t, 3);
            const p = latLngToScreen(rp.lat, rp.lng, w, h);
            const maxR = rp.role === 'pb' ? 28 : (rp.role === 'latest' ? 22 : 16);
            const radius = 3 + ease * maxR;
            const alpha = (1 - ease) * (rp.role === 'pb' ? 0.85 : 0.45);

            ctx.save();
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
            ctx.strokeStyle = rp.role === 'pb'
              ? pal.accentAmber
              : (rp.role === 'latest' ? pal.accentVolt : pal.swarmDot);
            ctx.globalAlpha = alpha;
            ctx.lineWidth = rp.role === 'pb' ? 1.8 : 1.2;
            ctx.stroke();
            ctx.restore();
          }
          finishRipples = aliveRipples;
        }

        // 8. Draw Vehicle Dots (layered: dimmed -> swarm -> arrived -> latest -> PB -> selected)
        // Layer 1: Out-of-filter dimmed dots
        if (activeRouteFilter !== 'ALL') {
          ctx.save();
          ctx.fillStyle = pal.swarmDim;
          ctx.beginPath();
          for (const r of racers) {
            if (r.matchesFilter || r.isSelected || r.status !== 'active') continue;
            ctx.moveTo(r.pos.x + 2, r.pos.y);
            ctx.arc(r.pos.x, r.pos.y, 2, 0, Math.PI * 2);
          }
          ctx.fill();
          ctx.restore();
        }

        // Layer 2: Active swarm dots
        ctx.save();
        ctx.fillStyle = pal.swarmDot;
        ctx.beginPath();
        for (const r of racers) {
          if (!r.matchesFilter || r.isPb || r.isLatest || r.isSelected || r.status !== 'active') continue;
          ctx.moveTo(r.pos.x + 2.6, r.pos.y);
          ctx.arc(r.pos.x, r.pos.y, 2.6, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.restore();

        // Layer 3: Arrived swarm subtle dots at finish
        ctx.save();
        ctx.fillStyle = pal.swarmDot;
        ctx.globalAlpha = 0.28;
        ctx.beginPath();
        for (const r of racers) {
          if (!r.matchesFilter || r.isPb || r.isLatest || r.isSelected || r.status !== 'arrived') continue;
          ctx.moveTo(r.pos.x + 2, r.pos.y);
          ctx.arc(r.pos.x, r.pos.y, 2, 0, Math.PI * 2);
        }
        ctx.fill();
        ctx.restore();

        // Layer 4: Highlighted roles (Latest, PB, Selected)
        const roleRacers = racers.filter(r => (r.isLatest || r.isPb || r.isSelected) && (r.matchesFilter || r.isSelected));
        roleRacers.sort((a, b) => (a.isSelected ? 3 : a.isPb ? 2 : 1) - (b.isSelected ? 3 : b.isPb ? 2 : 1));

        for (const r of roleRacers) {
          const { trip, state, pos, status, isPb, isLatest, isSelected } = r;
          if (status === 'waiting' && currentMode === 'relative' && !isSelected) continue;

          const baseColor = isSelected
            ? pal.selectedStroke
            : (isPb ? pal.accentAmber : pal.accentVolt);

          // Soft halo for active PB / Latest
          if (status === 'active' && (isPb || isLatest)) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, isPb ? 10 : 8.5, 0, Math.PI * 2);
            ctx.fillStyle = isPb ? pal.pbGlow : pal.voltGlow;
            ctx.fill();
            ctx.restore();
          }

          if (isSelected) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 8, 0, Math.PI * 2);
            ctx.strokeStyle = pal.selectedStroke;
            ctx.globalAlpha = 0.85;
            ctx.lineWidth = 1.4;
            ctx.stroke();
            ctx.restore();
          }

          // Vehicle body dot
          ctx.save();
          ctx.beginPath();
          const rad = isSelected ? 4.4 : (isPb ? 4.2 : 3.6);
          ctx.arc(pos.x, pos.y, rad, 0, Math.PI * 2);
          ctx.fillStyle = isSelected ? (isPb ? pal.accentAmber : pal.selectedStroke) : baseColor;
          ctx.globalAlpha = status === 'arrived' && !isSelected ? 0.65 : 1;
          ctx.fill();
          ctx.lineWidth = 1.25;
          ctx.strokeStyle = pal.labelHalo;
          ctx.stroke();
          ctx.restore();

          // Heading pointer for active highlighted vehicle
          if (status === 'active' && state.heading !== undefined && state.heading !== null) {
            const ang = ((state.heading - 90) * Math.PI) / 180;
            const len = isSelected ? 10 : 8;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            ctx.lineTo(pos.x + Math.cos(ang) * len, pos.y + Math.sin(ang) * len);
            ctx.strokeStyle = baseColor;
            ctx.lineWidth = 1.6;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();
          }

          // Micro tag for PB / Latest / Selected
          if (isSelected) {
            const tag = `${formatShortDate(trip.date, trip.dayName, true)} · ${state.speed} KM/H`;
            ctx.save();
            ctx.font = '600 10px "JetBrains Mono", monospace';
            const tw = ctx.measureText(tag).width;
            const boxW = tw + 12;
            const bx = Math.max(8, Math.min(w - boxW - 8, pos.x - boxW * 0.5));
            const by = pos.y < 88 ? pos.y + 14 : pos.y - 26;
            ctx.fillStyle = pal.selectedLabelBg;
            ctx.fillRect(bx, by, boxW, 16);
            ctx.strokeStyle = pal.lineStrong;
            ctx.lineWidth = 1;
            ctx.strokeRect(bx, by, boxW, 16);
            ctx.fillStyle = pal.selectedStroke;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(tag, bx + boxW * 0.5, by + 8);
            ctx.restore();
          } else if (status === 'active' && (isPb || isLatest)) {
            const tag = isPb ? 'PB' : 'ÚLT';
            ctx.save();
            ctx.font = '600 9px "JetBrains Mono", monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 3;
            ctx.strokeStyle = pal.labelHalo;
            ctx.strokeText(tag, pos.x + 8, pos.y - 6);
            ctx.fillStyle = baseColor;
            ctx.fillText(tag, pos.x + 8, pos.y - 6);
            ctx.restore();
          }
        }

        // 9. Camera Kinematics (overview / auto front-pack / follow-car / manual)
        const activeMatched = racers.filter(r => r.matchesFilter && r.status === 'active');
        activeMatched.sort((a, b) => a.distKm - b.distKm);
        const selectedRacer = selectedTripId ? racers.find(r => r.trip.id === selectedTripId) : null;

        if (cameraMode === 'follow-car' && selectedRacer) {
          targetLat = selectedRacer.state.lat;
          targetLng = selectedRacer.state.lng;
          targetZoom = Math.max(14.5, targetZoom);
        } else if (cameraMode === 'auto') {
          if (activeMatched.length === 0) {
            if (countArrived > 0 && countWaiting === 0) {
              targetLat = FINISH_PT.lat;
              targetLng = FINISH_PT.lng;
              targetZoom = 14.5;
            } else {
              fitCorridorBounds(false);
            }
          } else {
            const clusterSize = Math.min(5, activeMatched.length);
            const leadCluster = activeMatched.slice(0, clusterSize);
            let sumLat = 0, sumLng = 0;
            let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
            for (const c of leadCluster) {
              sumLat += c.state.lat;
              sumLng += c.state.lng;
              if (c.state.lat < minLat) minLat = c.state.lat;
              if (c.state.lat > maxLat) maxLat = c.state.lat;
              if (c.state.lng < minLng) minLng = c.state.lng;
              if (c.state.lng > maxLng) maxLng = c.state.lng;
            }
            targetLat = sumLat / clusterSize;
            targetLng = sumLng / clusterSize;
            const maxSpan = Math.max(0.0035, Math.max(maxLat - minLat, maxLng - minLng));
            targetZoom = Math.max(13.5, Math.min(15.2, 14.5 - Math.log2(maxSpan / 0.012)));
          }
        }

        // Smooth Spring Damping
        const damping = 0.065;
        curLat += (targetLat - curLat) * damping;
        curLng += (targetLng - curLng) * damping;
        curZoom += (targetZoom - curZoom) * damping;

        // 10. Sync Header Counter, Master Chronograph, Scrubber & HUD Subline
        if (currentMode === 'relative') {
          raceClockEl.textContent = formatClockMMSS(curRelativeTimeSec);
          raceClockEl.classList.remove('is-tod');
          statusCountNow.textContent = countArrived;
          statusCountTotal.textContent = countFiltered;
        } else {
          raceClockEl.textContent = formatClockTOD(curTimeOfDaySec);
          raceClockEl.classList.add('is-tod');
          statusCountNow.textContent = activeMatched.length;
          statusCountTotal.textContent = countFiltered;
        }

        updateScrubberProgressUI();
        renderHudSubline({
          activeRacers: activeMatched,
          selectedRacer,
          countArrived,
          totalFiltered: countFiltered
        });

        updateStandingsList(false);
      }

      /* ── Animation Loop (60 FPS) ──────────────────────────────────── */
      let lastFrameMs = performance.now();
      function loop(now) {
        const dt = Math.min(0.1, Math.max(0, (now - lastFrameMs) / 1000));
        lastFrameMs = now;

        if (isPlaying) {
          if (currentMode === 'relative') {
            curRelativeTimeSec += dt * playbackSpeed;
            if (curRelativeTimeSec >= REL_MAX_SEC) {
              curRelativeTimeSec = REL_MAX_SEC;
              isPlaying = false;
              updatePlayUI();
              updateStandingsList(true);
            }
          } else {
            curTimeOfDaySec += dt * playbackSpeed;
            if (curTimeOfDaySec >= TOD_MAX_SEC) {
              curTimeOfDaySec = TOD_MAX_SEC;
              isPlaying = false;
              updatePlayUI();
              updateStandingsList(true);
            }
          }
        }

        render(now);
        requestAnimationFrame(loop);
      }

      /* ── Event Bindings ───────────────────────────────────────────── */
      function togglePlayPause() {
        if (lightsOutSequence) {
          clearLightsOutSequence();
          playTick(780);
          updatePlayUI();
          return;
        }

        if (isPlaying) {
          playTick(820);
          isPlaying = false;
          updatePlayUI();
          return;
        }

        if (currentMode === 'relative' && curRelativeTimeSec >= REL_MAX_SEC) {
          curRelativeTimeSec = 0;
          prevStatuses.clear();
          finishRipples = [];
        } else if (currentMode === 'timeofday' && curTimeOfDaySec >= TOD_MAX_SEC) {
          curTimeOfDaySec = TOD_MIN_SEC;
          prevStatuses.clear();
          finishRipples = [];
        }

        if (currentMode === 'relative' && curRelativeTimeSec <= 0.5) {
          startLightsOutAndPlay();
          updatePlayUI();
        } else {
          playTick(1180);
          engagePlayback();
        }
      }

      function restartSimulation() {
        clearLightsOutSequence();
        playTick(920);
        isPlaying = false;
        prevStatuses.clear();
        finishRipples = [];
        if (currentMode === 'relative') {
          curRelativeTimeSec = 0;
        } else {
          curTimeOfDaySec = TOD_MIN_SEC;
        }
        if (!selectedTripId && !userHasManipulatedCamera) {
          cameraMode = 'overview';
          fitCorridorBounds(false);
          updateCameraBtnUI();
        }
        lastHudKey = '';
        updatePlayUI();
        updateScrubberProgressUI();
        updateStandingsList(true);
      }

      function switchMode(mode) {
        if (mode === currentMode) return;
        clearLightsOutSequence();
        playTick(1280, 0.015, 0.024);
        currentMode = mode;

        btnModeRace.classList.toggle('is-active', currentMode === 'relative');
        btnModeRace.setAttribute('aria-selected', currentMode === 'relative' ? 'true' : 'false');
        btnModeTime.classList.toggle('is-active', currentMode === 'timeofday');
        btnModeTime.setAttribute('aria-selected', currentMode === 'timeofday' ? 'true' : 'false');

        prevStatuses.clear();
        finishRipples = [];
        lastHudKey = '';
        renderScrubberTicks();
        syncScrubberBounds();
        updatePlayUI();
        updateStandingsList(true);
      }

      function toggleCameraView() {
        playTick(1080);
        const isCurrentlyFollowing = cameraMode === 'auto' || cameraMode === 'follow-car';
        if (isCurrentlyFollowing) {
          selectedTripId = null;
          cameraMode = 'overview';
          userHasManipulatedCamera = false;
          fitCorridorBounds(false);
        } else {
          userHasManipulatedCamera = false;
          cameraMode = selectedTripId ? 'follow-car' : 'auto';
        }
        updateCameraBtnUI();
        lastHudKey = '';
        updateStandingsList(true);
      }

      btnPlay.addEventListener('click', togglePlayPause);
      btnRewind.addEventListener('click', restartSimulation);
      btnModeRace.addEventListener('click', () => switchMode('relative'));
      btnModeTime.addEventListener('click', () => switchMode('timeofday'));
      btnCameraToggle.addEventListener('click', toggleCameraView);

      btnAudioToggle.addEventListener('click', () => {
        audioEnabled = !audioEnabled;
        updateAudioBtnUI();
        if (audioEnabled) playTick(1200, 0.014, 0.02);
      });

      speedBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          playTick(1040);
          speedBtns.forEach(b => b.classList.remove('is-active'));
          btn.classList.add('is-active');
          playbackSpeed = Number(btn.dataset.speed) || 30;
        });
      });

      // Scrubber Interactions (mouse, pointer & touch)
      function beginScrub() {
        isScrubbing = true;
        if (lightsOutSequence) {
          clearLightsOutSequence();
          updatePlayUI();
        }
      }
      function endScrub() {
        if (!isScrubbing) return;
        isScrubbing = false;
        updateStandingsList(true);
      }
      timeSlider.addEventListener('pointerdown', beginScrub);
      timeSlider.addEventListener('touchstart', beginScrub, { passive: true });
      window.addEventListener('pointerup', endScrub);
      window.addEventListener('pointercancel', endScrub);
      window.addEventListener('touchend', endScrub, { passive: true });
      window.addEventListener('touchcancel', endScrub, { passive: true });
      timeSlider.addEventListener('input', (e) => {
        isScrubbing = true;
        if (lightsOutSequence) {
          clearLightsOutSequence();
          updatePlayUI();
        }
        const val = Number(e.target.value);
        if (currentMode === 'relative') {
          curRelativeTimeSec = val;
        } else {
          curTimeOfDaySec = val;
        }
        prevStatuses.clear();
        updateScrubberProgressUI();
        updatePlayUI();
      });
      timeSlider.addEventListener('change', () => {
        endScrub();
      });

      // Drawer Interactions
      function setDrawerOpen(open) {
        isDrawerOpen = Boolean(open);
        standingsDrawer.classList.toggle('is-open', isDrawerOpen);
        toggleStandingsBtn.classList.toggle('is-open', isDrawerOpen);
        if (isDrawerOpen) {
          updateStandingsList(true);
        }
      }

      toggleStandingsBtn.addEventListener('click', () => {
        playTick(980);
        setDrawerOpen(!isDrawerOpen);
      });

      closeDrawerBtn.addEventListener('click', () => {
        playTick(840);
        setDrawerOpen(false);
      });

      // Delegated row click in standings drawer
      standingsScroll.addEventListener('click', (e) => {
        const row = e.target.closest('[data-id]');
        if (!row) return;
        playTick(1220);
        const id = row.dataset.id;
        if (selectedTripId === id && cameraMode === 'follow-car') {
          selectedTripId = null;
          cameraMode = 'auto';
        } else {
          selectedTripId = id;
          cameraMode = 'follow-car';
        }
        userHasManipulatedCamera = false;
        updateCameraBtnUI();
        lastHudKey = '';
        updateStandingsList(true);
        if (window.innerWidth < 768 && selectedTripId) {
          setDrawerOpen(false);
        }
      });

      // Hit-testing vehicles on canvas click/tap
      function findVehicleNearScreen(sx, sy, threshold = 24) {
        let closest = null;
        let minDist = threshold;
        for (const r of currentRenderedRacers) {
          if (!r.matchesFilter && !r.isSelected) continue;
          if (r.status === 'waiting' && currentMode === 'timeofday') continue;
          const dx = r.pos.x - sx;
          const dy = r.pos.y - sy;
          const dist = Math.hypot(dx, dy);
          if (dist < minDist) {
            minDist = dist;
            closest = r;
          }
        }
        return closest;
      }

      function selectOrReleaseFromTap(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const hit = findVehicleNearScreen(clientX - rect.left, clientY - rect.top);
        if (hit) {
          playTick(1260);
          selectedTripId = hit.trip.id;
          cameraMode = 'follow-car';
          userHasManipulatedCamera = false;
          updateCameraBtnUI();
          lastHudKey = '';
          updateStandingsList(true);
        } else if (selectedTripId) {
          playTick(880);
          selectedTripId = null;
          if (cameraMode === 'follow-car') {
            cameraMode = userHasManipulatedCamera ? 'manual' : 'auto';
          }
          updateCameraBtnUI();
          lastHudKey = '';
          updateStandingsList(true);
        }
      }

      // Mouse Pan / Wheel / Double Click
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragTotalMove = 0;
        dragStartX = e.clientX;
        dragStartY = e.clientY;
        dragStartLat = targetLat;
        dragStartLng = targetLng;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - dragStartX;
        const dy = e.clientY - dragStartY;
        dragTotalMove += Math.abs(dx) + Math.abs(dy);

        if (dragTotalMove > 5) {
          cameraMode = 'manual';
          userHasManipulatedCamera = true;
          updateCameraBtnUI();
          const baseZoom = Math.floor(curZoom);
          const subScale = Math.pow(2, curZoom - baseZoom);
          const centerWorld = projectMercator(dragStartLat, dragStartLng, baseZoom);
          const unp = unprojectMercator(
            centerWorld.x - dx / subScale,
            centerWorld.y - dy / subScale,
            baseZoom
          );
          targetLat = unp.lat;
          targetLng = unp.lng;
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (isDragging && dragTotalMove <= 5) {
          selectOrReleaseFromTap(e.clientX, e.clientY);
        }
        isDragging = false;
      });

      canvas.addEventListener('dblclick', (e) => {
        e.preventDefault();
        toggleCameraView();
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        cameraMode = 'manual';
        userHasManipulatedCamera = true;
        updateCameraBtnUI();

        const rect = canvas.getBoundingClientRect();
        const cursorX = e.clientX - rect.left;
        const cursorY = e.clientY - rect.top;
        const before = screenToLatLng(cursorX, cursorY);

        const factor = e.deltaY < 0 ? 0.32 : -0.32;
        const nextZoom = Math.max(11.0, Math.min(17.5, targetZoom + factor));
        targetZoom = nextZoom;
        curZoom += (nextZoom - curZoom) * 0.4;

        const after = screenToLatLng(cursorX, cursorY);
        targetLat += before.lat - after.lat;
        targetLng += before.lng - after.lng;
      }, { passive: false });

      // Touch Pan / Pinch Zoom / Double Tap
      let lastTapMs = 0;
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          dragTotalMove = 0;
          dragStartX = e.touches[0].clientX;
          dragStartY = e.touches[0].clientY;
          dragStartLat = targetLat;
          dragStartLng = targetLng;
        } else if (e.touches.length === 2) {
          isDragging = false;
          cameraMode = 'manual';
          userHasManipulatedCamera = true;
          updateCameraBtnUI();
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          initialPinchDist = Math.hypot(dx, dy);
          initialPinchZoom = targetZoom;
        }
      }, { passive: true });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isDragging) {
          const dx = e.touches[0].clientX - dragStartX;
          const dy = e.touches[0].clientY - dragStartY;
          dragTotalMove += Math.abs(dx) + Math.abs(dy);

          if (dragTotalMove > 8) {
            cameraMode = 'manual';
            userHasManipulatedCamera = true;
            updateCameraBtnUI();
            const baseZoom = Math.floor(curZoom);
            const subScale = Math.pow(2, curZoom - baseZoom);
            const centerWorld = projectMercator(dragStartLat, dragStartLng, baseZoom);
            const unp = unprojectMercator(
              centerWorld.x - dx / subScale,
              centerWorld.y - dy / subScale,
              baseZoom
            );
            targetLat = unp.lat;
            targetLng = unp.lng;
          }
        } else if (e.touches.length === 2 && initialPinchDist > 0) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          const ratio = dist / initialPinchDist;
          targetZoom = Math.max(11.0, Math.min(17.5, initialPinchZoom + Math.log2(ratio)));
        }
      }, { passive: true });

      canvas.addEventListener('touchend', (e) => {
        if (isDragging && dragTotalMove <= 8 && e.changedTouches && e.changedTouches.length > 0) {
          const now = performance.now();
          const touch = e.changedTouches[0];
          if (now - lastTapMs < 280) {
            lastTapMs = 0;
            const rect = canvas.getBoundingClientRect();
            const hit = findVehicleNearScreen(touch.clientX - rect.left, touch.clientY - rect.top);
            if (!hit) {
              toggleCameraView();
            } else {
              selectOrReleaseFromTap(touch.clientX, touch.clientY);
            }
          } else {
            lastTapMs = now;
            selectOrReleaseFromTap(touch.clientX, touch.clientY);
          }
        }
        isDragging = false;
        initialPinchDist = 0;
      }, { passive: true });

      // Close & Keyboard Shortcuts
      function triggerCloseGhostRace() {
        clearLightsOutSequence();
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'OCTANE_CLOSE_GHOST_RACE' }, '*');
        } else {
          window.location.href = '/';
        }
      }

      btnClose.addEventListener('click', triggerCloseGhostRace);

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlayPause();
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          restartSimulation();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          switchMode(currentMode === 'relative' ? 'timeofday' : 'relative');
        } else if (e.code === 'Escape') {
          e.preventDefault();
          if (isDrawerOpen) {
            setDrawerOpen(false);
          } else {
            triggerCloseGhostRace();
          }
        }
      });

      window.addEventListener('resize', () => {
        resizeCanvas();
        if (cameraMode === 'overview') {
          fitCorridorBounds(false);
        }
      });
      window.addEventListener('orientationchange', () => {
        setTimeout(() => {
          resizeCanvas();
          if (cameraMode === 'overview') {
            fitCorridorBounds(false);
          }
        }, 120);
      });

      /* ── Parent Window Bridge & Fallback JSON Loader ──────────────── */
      let dataSourceKind = 'none'; // 'none' | 'default' | 'dynamic'
      let defaultLoadPromise = null;

      async function loadDefaultDataset() {
        if (dataSourceKind !== 'none') return;
        if (defaultLoadPromise) return defaultLoadPromise;
        defaultLoadPromise = (async () => {
          try {
            const res = await fetch('./ghost-race-data.json', { cache: 'default' });
            if (!res.ok) return;
            const json = await res.json();
            if (dataSourceKind === 'none' && Array.isArray(json) && json.length > 0) {
              dataSourceKind = 'default';
              calibrateDataset(json, null);
            }
          } catch (_) {
          } finally {
            defaultLoadPromise = null;
          }
        })();
        return defaultLoadPromise;
      }

      window.addEventListener('message', (e) => {
        const msg = e.data;
        if (!msg || typeof msg !== 'object') return;

        if (msg.type === 'OCTANE_THEME_CHANGE' && (msg.theme === 'light' || msg.theme === 'dark')) {
          applyTheme(msg.theme);
          return;
        }

        if (msg.type === 'OCTANE_GHOST_RACE_INIT') {
          if (msg.theme === 'light' || msg.theme === 'dark') {
            applyTheme(msg.theme);
          }
          if (Array.isArray(msg.trips) && msg.trips.length > 0) {
            dataSourceKind = 'dynamic';
            calibrateDataset(msg.trips, msg.route || null);
          } else {
            loadDefaultDataset();
          }
        }
      });

      /* ── Boot ─────────────────────────────────────────────────────── */
      applyTheme(resolveInitialTheme());
      resizeCanvas();
      updateAudioBtnUI();
      updateCameraBtnUI();
      updatePlayUI();
      requestAnimationFrame(loop);

      // Signal readiness to parent and fall back cleanly if standalone or parent sends null trips
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage({ type: 'OCTANE_GHOST_RACE_READY' }, '*');
        } catch (_) {}
        setTimeout(() => {
          if (dataSourceKind === 'none') loadDefaultDataset();
        }, 120);
      } else {
        loadDefaultDataset();
      }
    })();
  </script>
</body>
</html>
