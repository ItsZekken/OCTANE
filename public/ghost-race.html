<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#09090B" id="meta-theme-color">
  <title>OCTANE — Ghost Race</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root,
    :root[data-theme="dark"] {
      --bg-void: #09090B;
      --bg-surface: #0E0E11;
      --bg-elevated: #141418;
      --line-hair: #1E1E24;
      --line-strong: #2E2E38;
      --text-primary: #F4F4F6;
      --text-secondary: #8A8A93;
      --text-muted: #4A4A52;
      --accent-amber: #FF5500;
      --accent-volt: #10B981;
      --accent-cyan: #38BDF8;
      --hud-backdrop: rgba(9, 9, 11, 0.72);
      --hud-shadow: 0 1px 10px rgba(9, 9, 11, 0.85);
      --ctrl-bg: rgba(14, 14, 17, 0.86);
      --btn-contrast: #09090B;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg-void: #F2F0EB;
      --bg-surface: #F9F8F5;
      --bg-elevated: #EAE7E0;
      --line-hair: #DEDBD2;
      --line-strong: #C4C0B5;
      --text-primary: #111113;
      --text-secondary: #63636B;
      --text-muted: #9D9DA6;
      --accent-amber: #E04800;
      --accent-volt: #059669;
      --accent-cyan: #0284C7;
      --hud-backdrop: rgba(242, 240, 235, 0.86);
      --hud-shadow: 0 1px 10px rgba(242, 240, 235, 0.96);
      --ctrl-bg: rgba(249, 248, 245, 0.90);
      --btn-contrast: #F9F8F5;
      color-scheme: light;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    button {
      font: inherit;
      color: inherit;
      background: transparent;
      border: 0;
      padding: 0;
      margin: 0;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 1px solid var(--accent-amber);
      outline-offset: -1px;
    }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* ── Header (48px flat instrument chrome) ───────────────────────── */
    .gr-header {
      height: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 12px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--line-hair);
      z-index: 30;
    }

    .gr-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1 1 0;
    }

    .gr-dot-amber {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-amber);
      flex-shrink: 0;
    }

    .gr-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--text-primary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .gr-route-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      display: none;
    }

    @media (min-width: 640px) {
      .gr-header {
        padding: 0 16px;
      }
      .gr-route-label {
        display: inline;
      }
    }

    .gr-mode-seg {
      display: inline-flex;
      align-items: center;
      height: 28px;
      border: 1px solid var(--line-hair);
      border-radius: 2px;
      background: var(--bg-void);
      flex-shrink: 0;
    }

    .gr-mode-btn {
      height: 100%;
      padding: 0 10px;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      transition: background-color 0.15s ease, color 0.15s ease;
      white-space: nowrap;
    }

    .gr-mode-btn + .gr-mode-btn {
      border-left: 1px solid var(--line-hair);
    }

    .gr-mode-btn.is-active {
      background: var(--bg-elevated);
      color: var(--accent-amber);
      font-weight: 600;
    }

    .gr-header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      flex: 1 1 0;
      min-width: 0;
    }

    .gr-standings-btn {
      height: 32px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line-hair);
      border-radius: 2px;
      color: var(--text-secondary);
      font-size: 11px;
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    }

    .gr-standings-btn:hover,
    .gr-standings-btn.is-open {
      border-color: var(--line-strong);
      color: var(--text-primary);
      background: var(--bg-elevated);
    }

    .gr-standings-btn .gr-count-now {
      color: var(--text-primary);
      font-weight: 500;
    }

    .gr-close-btn {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 2px;
      color: var(--text-secondary);
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
      flex-shrink: 0;
    }

    .gr-close-btn:hover {
      border-color: var(--line-hair);
      color: var(--text-primary);
      background: var(--bg-elevated);
    }

    /* ── Main Canvas Stage ─────────────────────────────────────────── */
    .gr-stage {
      position: relative;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      overflow: hidden;
      background: var(--bg-void);
    }

    #race-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    #race-canvas:active {
      cursor: grabbing;
    }

    /* Top-left Typographic HUD (zero heavy card) */
    .gr-hud {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      pointer-events: none;
      max-width: calc(100% - 104px);
    }

    @media (min-width: 640px) {
      .gr-hud {
        top: 18px;
        left: 20px;
      }
    }

    .gr-clock-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 2px 10px 2px 0;
      background: linear-gradient(90deg, var(--hud-backdrop) 0%, var(--hud-backdrop) 65%, transparent 100%);
    }

    .gr-clock {
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      text-shadow: var(--hud-shadow);
    }

    .gr-clock.is-tod {
      font-size: clamp(24px, 4.2vw, 36px);
    }

    .gr-lights {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .gr-lights.is-visible {
      opacity: 1;
    }

    .gr-light-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--line-strong);
      transition: background-color 0.08s ease;
    }

    .gr-light-dot.is-lit {
      background: var(--accent-amber);
    }

    .gr-subline {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      max-width: 100%;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 2px 10px 2px 0;
      text-shadow: var(--hud-shadow);
      background: linear-gradient(90deg, var(--hud-backdrop) 0%, var(--hud-backdrop) 72%, transparent 100%);
    }

    .gr-subline-chip {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-primary);
      padding: 2px 7px;
      background: var(--ctrl-bg);
      border: 1px solid var(--line-strong);
      border-radius: 2px;
      transition: border-color 0.15s ease;
      max-width: 100%;
      min-width: 0;
      overflow: hidden;
    }

    .gr-subline-chip-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .gr-subline-chip:hover {
      border-color: var(--accent-amber);
    }

    .gr-dot-inline {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Top-right Map Controls (max 2 flat 32x32 buttons) */
    .gr-map-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    @media (min-width: 640px) {
      .gr-map-controls {
        top: 18px;
        right: 20px;
      }
    }

    .gr-icon-btn {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--ctrl-bg);
      border: 1px solid var(--line-hair);
      border-radius: 2px;
      color: var(--text-secondary);
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
      position: relative;
    }

    .gr-icon-btn:hover {
      border-color: var(--line-strong);
      color: var(--text-primary);
    }

    .gr-icon-btn.is-active {
      border-color: var(--line-strong);
      color: var(--accent-amber);
    }

    .gr-icon-btn .gr-cam-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-amber);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .gr-icon-btn.is-active .gr-cam-dot {
      opacity: 1;
    }

    /* ── Standings Slide-Over Drawer ───────────────────────────────── */
    .gr-drawer {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(320px, 86vw);
      background: var(--bg-surface);
      border-left: 1px solid var(--line-hair);
      z-index: 25;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .gr-drawer.is-open {
      transform: translateX(0);
    }

    .gr-drawer-head {
      height: 44px;
      padding: 0 12px;
      border-bottom: 1px solid var(--line-hair);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .gr-drawer-title {
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--text-primary);
      font-weight: 600;
    }

    .gr-drawer-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-bottom: 1px solid var(--line-hair);
      flex-shrink: 0;
    }

    .gr-drawer-metric {
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .gr-drawer-metric + .gr-drawer-metric {
      border-left: 1px solid var(--line-hair);
    }

    .gr-metric-lbl {
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--text-muted);
    }

    .gr-metric-val {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .gr-route-filters {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line-hair);
      overflow-x: auto;
      scrollbar-width: none;
      flex-shrink: 0;
    }

    .gr-route-filters::-webkit-scrollbar {
      display: none;
    }

    .gr-filter-btn {
      height: 24px;
      padding: 0 8px;
      border: 1px solid var(--line-hair);
      border-radius: 2px;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    }

    .gr-filter-btn:hover {
      border-color: var(--line-strong);
      color: var(--text-primary);
    }

    .gr-filter-btn.is-active {
      border-color: var(--accent-amber);
      background: var(--bg-elevated);
      color: var(--accent-amber);
      font-weight: 600;
    }

    .gr-drawer-list {
      flex: 1 1 0;
      overflow-y: auto;
      min-height: 0;
    }

    .gr-drawer-list::-webkit-scrollbar {
      width: 3px;
    }

    .gr-drawer-list::-webkit-scrollbar-thumb {
      background: var(--line-strong);
    }

    .gr-trip-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-bottom: 1px solid var(--line-hair);
      cursor: pointer;
      transition: background-color 0.12s ease;
    }

    .gr-trip-row:hover {
      background: var(--bg-elevated);
    }

    .gr-trip-row.is-selected {
      background: var(--bg-elevated);
      box-shadow: inset 2px 0 0 var(--accent-amber);
    }

    .gr-trip-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .gr-trip-rank {
      width: 24px;
      font-size: 10px;
      color: var(--text-muted);
      text-align: right;
      flex-shrink: 0;
    }

    .gr-trip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .gr-trip-info {
      min-width: 0;
    }

    .gr-trip-date {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gr-trip-meta {
      margin-top: 2px;
      font-size: 9px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gr-trip-right {
      text-align: right;
      flex-shrink: 0;
    }

    .gr-trip-stat {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .gr-trip-delta {
      margin-top: 2px;
      font-size: 9px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* ── Bottom Control Deck ───────────────────────────────────────── */
    .gr-deck {
      flex-shrink: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--line-hair);
      padding: 10px 12px max(12px, env(safe-area-inset-bottom, 12px));
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 30;
    }

    @media (min-width: 640px) {
      .gr-deck {
        padding: 10px 16px max(14px, env(safe-area-inset-bottom, 14px));
      }
    }

    .gr-scrubber-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gr-scrub-lbl {
      font-size: 10px;
      color: var(--text-secondary);
      flex-shrink: 0;
      min-width: 36px;
    }

    .gr-scrub-lbl.is-end {
      text-align: right;
    }

    .gr-scrub-track-wrap {
      position: relative;
      flex: 1 1 0;
      height: 22px;
      display: flex;
      align-items: center;
      cursor: ew-resize;
    }

    .gr-scrub-ticks {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .gr-scrub-tick {
      position: absolute;
      top: 50%;
      width: 1px;
      height: 7px;
      transform: translate(-50%, -50%);
      background: var(--line-strong);
      opacity: 0.7;
    }

    .gr-scrub-tick.is-pb {
      width: 1.5px;
      height: 11px;
      background: var(--accent-amber);
      opacity: 1;
      z-index: 2;
    }

    .gr-scrub-tick.is-latest {
      background: var(--accent-volt);
      height: 9px;
      opacity: 0.95;
      z-index: 1;
    }

    .gr-scrub-rail {
      position: relative;
      width: 100%;
      height: 2px;
      background: var(--line-hair);
    }

    .gr-scrub-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--accent-amber);
    }

    .gr-scrub-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      width: 8px;
      height: 14px;
      border-radius: 2px;
      background: var(--accent-amber);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #time-slider {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: ew-resize;
      touch-action: none;
      z-index: 3;
    }

    .gr-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .gr-play-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gr-play-btn {
      height: 36px;
      padding: 0 16px;
      border-radius: 2px;
      background: var(--accent-amber);
      color: var(--btn-contrast);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    .gr-play-btn:active {
      transform: scale(0.97);
    }

    .gr-restart-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--line-hair);
      border-radius: 2px;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    }

    .gr-restart-btn:hover {
      border-color: var(--line-strong);
      color: var(--text-primary);
      background: var(--bg-elevated);
    }

    .gr-speed-seg {
      display: inline-flex;
      align-items: center;
      height: 32px;
      border: 1px solid var(--line-hair);
      border-radius: 2px;
      background: var(--bg-void);
    }

    .gr-speed-btn {
      height: 100%;
      padding: 0 9px;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .gr-speed-btn + .gr-speed-btn {
      border-left: 1px solid var(--line-hair);
    }

    .gr-speed-btn.is-active {
      background: var(--bg-elevated);
      color: var(--accent-amber);
      font-weight: 600;
    }

    .is-hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- HEADER ÚNICO ULTRADELGADO (48PX) -->
  <header class="gr-header">
    <div class="gr-brand">
      <span class="gr-dot-amber" aria-hidden="true"></span>
      <span class="gr-title mono">GHOST RACE</span>
      <span id="route-subtitle" class="gr-route-label mono">LA CEIBA → UNINORTE</span>
    </div>

    <div class="gr-mode-seg mono" role="tablist" aria-label="Modo de simulación">
      <button id="btn-mode-race" type="button" class="gr-mode-btn is-active" role="tab" aria-selected="true">CARRERA</button>
      <button id="btn-mode-time" type="button" class="gr-mode-btn" role="tab" aria-selected="false">HORA REAL</button>
    </div>

    <div class="gr-header-actions">
      <button id="toggle-standings" type="button" class="gr-standings-btn mono tabular" aria-label="Clasificación">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <span><span id="status-count-now" class="gr-count-now">0</span>/<span id="status-count-total">0</span></span>
      </button>

      <button id="btn-close-ghost-race" type="button" class="gr-close-btn" aria-label="Cerrar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- VIEWPORT CANVAS PROTAGONISTA -->
  <main class="gr-stage">
    <canvas id="race-canvas"></canvas>

    <!-- HUD TIPOGRÁFICO ÚNICO ARRIBA IZQUIERDA -->
    <div class="gr-hud">
      <div class="gr-clock-row">
        <span id="race-clock" class="gr-clock mono tabular">00:00</span>
